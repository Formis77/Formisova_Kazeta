<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kazeta">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Kazeta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Kazeta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen app shell. Clean white ground, black panels (feature card, mini player, player, queue),
   cyan as the main accent and magenta as the second neon accent. Round "vinyl" covers for songs.
   A deliberate single look (white + black scope), not tied to the phone's dark mode. */
:root{
  --cyan:#22d3c5; --cyan-d:#0b9c91; --mag:#e43fd3; --mag-d:#b5209f; --char:#121214;
  --ink:#ffffff;          /* page */
  --deck:#f4f5f7;         /* soft surfaces */
  --deck-2:#ebedf0;       /* pressed */
  --glass:#f4f5f7;
  --line:#e7e8ec;
  --fg:#121214;
  --mute:#878a92;
  --tape:#0b9c91;         /* accent text / checks on white */
  --tape-ink:#ffffff;
  --danger:#e5484d;
  --shadow:0 8px 24px rgba(18,18,20,.08);
  --display:"Poppins", "Avenir Next", system-ui, sans-serif;
  --body:"Poppins", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono:"Poppins", -apple-system, system-ui, sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ink);color:var(--fg);font:400 14.5px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;transition:transform .15s ease,background-color .2s ease,color .2s ease,box-shadow .2s ease}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:10px}
svg{display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding-block:12px 6px;min-height:62px}
.top h1{flex:1;margin:0;font:600 20px/1.15 var(--display);letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top h1.logo{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--display);letter-spacing:-.02em}
.top h1.logo svg{flex:none}
.top .back,.cb{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--deck);flex:none;color:var(--fg)}
.top .back{margin-left:-2px}
.pill{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:20px;background:var(--deck);font-weight:500;font-size:13.5px;white-space:nowrap}
.pill.amber{background:var(--char);color:#fff}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:2px 20px;min-height:0}
h2{font:600 18px/1.2 var(--display);letter-spacing:-.01em;margin:26px 0 10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.sechead h2{margin:0}
.seeall{font-size:13px;font-weight:500;color:var(--mute);white-space:nowrap}
.muted{color:var(--mute)}
.small{font-size:12.5px}

main.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.04s}main.enter>*:nth-child(3){animation-delay:.08s}main.enter>*:nth-child(4){animation-delay:.12s}main.enter>*:nth-child(5){animation-delay:.16s}main.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* art: songs are round like records, collections are rounded squares */
.art{flex:none;border-radius:14px;object-fit:cover;background:var(--deck-2);display:grid;place-items:center;overflow:hidden;font:600 18px var(--display);color:#fff}
.art.ph{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 50%),linear-gradient(145deg,var(--a,#3fe0d0),var(--b,#12a99c));color:var(--fgc,#fff)}
.art.sm{width:48px;height:48px;font-size:17px}
.art.md{width:56px;height:56px}
.art.lg{width:100%;aspect-ratio:1;max-width:100%;font-size:46px;border-radius:24px}
.art.round{border-radius:50%}
.art.liked{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.3),transparent 50%),linear-gradient(140deg,var(--mag),#b5209f 45%,var(--cyan-d));color:#fff}
.row .art.sm,.qtap .art,.qnow .art,.sh-head .art,#mini .art,.wr-list .art,.st-list .art,.ef-cover .art{border-radius:50%}

/* rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:6px 8px;margin:0 -8px;min-height:62px;cursor:pointer;border-radius:16px;transition:background-color .2s ease}
.row:active{background:var(--deck)}
.row.cur{background:var(--deck)}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.cur .t{color:var(--cyan-d)}
.row .lk{color:var(--mag)}
.row.swq{background:#d9f7f4}
.dur{font:500 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--mute);flex:none}
.ib:active{background:var(--deck-2)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px;vertical-align:-1px}
.eq i{width:3px;background:var(--cyan);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s;background:var(--mag)}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* home */
.hello{margin:2px 0 14px}
.hello small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.hello b{display:block;font:700 28px/1.15 var(--display);letter-spacing:-.025em}
.searchbtn{display:flex;align-items:center;gap:10px;width:100%;height:50px;padding:0 16px;border-radius:25px;background:var(--deck);color:var(--mute);font-size:14px;text-align:left;margin-bottom:16px}
.feat{position:relative;display:flex;align-items:center;gap:16px;padding:16px;border-radius:28px;background:var(--char);color:#fff;overflow:hidden;margin-bottom:16px;isolation:isolate}
.feat::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 100% 0%,rgba(228,63,211,.35),transparent 70%),radial-gradient(60% 90% at 0% 100%,rgba(34,211,197,.3),transparent 70%);z-index:-1}
.feat .disc{position:relative;width:96px;height:96px;flex:none;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.5)}
.feat .disc .art{width:96px;height:96px;border-radius:50%;font-size:32px}
.feat .disc::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--char);box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.feat.live .disc{animation:spin 18s linear infinite}
.feat .meta{flex:1;min-width:0}
.feat .k{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--cyan)}
.feat .t{font:600 18px/1.2 var(--display);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .s{font-size:13px;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .playbig{width:50px;height:50px}
@keyframes spin{to{transform:rotate(360deg)}}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;background:var(--deck);border-radius:18px;overflow:hidden;min-width:0;height:62px;padding:6px;text-align:left;font-weight:600;font-size:13.5px}
.tile .art{border-radius:13px;width:50px!important;height:50px!important}
.tile span{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding-right:6px;line-height:1.25}
.shelf{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.shelf::-webkit-scrollbar{display:none}
.cover{flex:none;width:136px;scroll-snap-align:start;text-align:left}
.cover .art{width:136px;height:136px;border-radius:24px}
.shelf .cover .art{border-radius:50%;box-shadow:0 10px 24px rgba(18,18,20,.15)}
.shelf .cover{text-align:center}
.cover b{display:block;font-weight:600;font-size:13.5px;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}
.grid2 .cover{width:auto}
.grid2 .cover .art{width:100%;height:auto;aspect-ratio:1}

.empty{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:24px 22px 26px;background:var(--char);color:#fff;border-radius:28px;margin-top:8px;position:relative;overflow:hidden;isolation:isolate}
.empty::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 100% 0%,rgba(228,63,211,.35),transparent 70%),radial-gradient(70% 60% at 0% 100%,rgba(34,211,197,.3),transparent 70%);z-index:-1}
.empty h3{margin:0;font:700 24px/1.15 var(--display);letter-spacing:-.02em}
.empty p,.empty .steps{margin:0;color:rgba(255,255,255,.7);max-width:46ch}
.empty .acts{display:flex;flex-wrap:wrap;gap:8px}
.empty .pill.amber{background:var(--cyan);color:var(--char)}
.empty .pill{background:rgba(255,255,255,.12);color:#fff}
.cassette{width:150px;height:96px;margin-bottom:4px}
.steps{padding-left:20px;display:flex;flex-direction:column;gap:4px}

.banner{display:flex;gap:10px;align-items:flex-start;background:#e3faf7;color:#075e57;border-radius:18px;padding:12px 8px 12px 14px;font-size:12.5px;margin:4px 0 14px}
.banner p{margin:0;flex:1}
.banner .ib{width:28px;height:28px;color:#075e57}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px 0 16px;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 17px;border-radius:19px;background:var(--deck);font-size:13.5px;font-weight:500;white-space:nowrap;flex:none;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--char);color:#fff}
.chip.sm{height:32px;padding:0 13px;font-size:12.5px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar .grow{flex:1;min-width:0}
.playbig{width:56px;height:56px;border-radius:50%;background:var(--cyan);color:var(--char);display:grid;place-items:center;flex:none;box-shadow:0 8px 22px rgba(34,211,197,.4)}
.playbig:active{transform:scale(.94)}

.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:4px}
.hero .art.lg,.hero .mosaic{width:min(60vw,230px);box-shadow:0 18px 40px rgba(18,18,20,.18)}
.hero .art.lg.round{box-shadow:0 0 0 8px var(--deck),0 18px 40px rgba(18,18,20,.18)}
.hero .kind{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--cyan-d);margin-top:16px;font-weight:600}
.hero h3{margin:0;font:700 28px/1.12 var(--display);letter-spacing:-.025em;text-wrap:balance}
.hero .sub{color:var(--mute);font-size:13.5px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1;border-radius:24px;overflow:hidden;max-width:100%}
.mosaic .art{width:100%;height:100%;border-radius:0}
.pc2{display:flex;align-items:center;gap:10px;margin:18px 0 0}
.pc-modes{display:flex;gap:8px;flex:1;min-width:0}
.mode{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:74px;height:58px;border-radius:18px;background:var(--deck);color:var(--mute);font-size:11.5px;font-weight:500;position:relative}
.mode[aria-pressed="true"]{color:var(--cyan);background:var(--char)}
.mode:active{transform:scale(.96)}
.pc2 .playbig{width:60px;height:60px}
.pc-cap{font-size:12.5px;color:var(--mute);margin:8px 0 12px}
.coverbtn{position:relative;display:block;width:min(60vw,230px);max-width:100%;border-radius:24px}
.coverbtn .art.lg,.coverbtn .mosaic{width:100%}
.coverbtn>span{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;background:rgba(18,18,20,.8);color:#fff;display:grid;place-items:center}
.sortbar{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px 0 10px;padding:2px 0}.sortbar::-webkit-scrollbar{display:none}
.textbtns{display:flex;gap:6px;flex-wrap:wrap}
.qh{width:40px;height:44px;display:grid;place-items:center;color:var(--mute);touch-action:none;flex:none;cursor:grab}
.ck{display:inline-block;vertical-align:-2px;margin-right:4px}.ck svg{display:inline}
.ckempty{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt .ckc{color:inherit}

.impcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#e3faf7;border-radius:22px;padding:10px 14px 10px 10px;margin-bottom:14px}
.impcard .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.impcard b{font:600 15px var(--display)}.impcard small{color:#3f6f6a;font-size:12.5px}
.impcard svg{color:var(--cyan-d)}
.wrcard{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:26px;padding:18px 16px 18px 20px;margin-top:16px;background:var(--char);color:#fff;overflow:hidden;isolation:isolate}
.wrcard::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(228,63,211,.55),rgba(181,32,159,.35) 45%,rgba(34,211,197,.45));z-index:-1}
.wrcard .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.wrcard b{font:700 19px/1.15 var(--display);letter-spacing:-.01em}.wrcard small{font-size:12.5px;opacity:.75}
.wrcard>svg{width:42px;height:42px;padding:10px;border-radius:50%;background:rgba(255,255,255,.14);flex:none}
.wrcard.ready{margin:0 0 16px;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(34,211,197,.35)}}

.wr-hero{position:relative;border-radius:28px;padding:22px 20px;background:var(--char);color:#fff;overflow:hidden;isolation:isolate}
.wr-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 70% at 100% 0%,rgba(228,63,211,.45),transparent 70%),radial-gradient(70% 70% at 0% 100%,rgba(34,211,197,.4),transparent 70%);z-index:-1}
.wr-hero p{margin:8px 0 0;opacity:.7}
.wr-k{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;opacity:.75}
.wr-big{font:700 70px/1 var(--display);letter-spacing:-.04em;margin-top:12px;font-variant-numeric:tabular-nums}
.wr-unit{font:500 17px var(--display);margin-top:2px}
.wr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.wr-tile{background:var(--deck);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--fg)}
.wr-grid .wr-tile:nth-child(1){background:var(--cyan);color:var(--char)}.wr-grid .wr-tile:nth-child(2){background:var(--mag);color:#fff}.wr-grid .wr-tile:nth-child(3){background:var(--char);color:#fff}.wr-grid .wr-tile:nth-child(4){background:var(--deck)}
.wr-tile b{font:700 32px/1.05 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.wr-tile b small{font-size:16px;opacity:.6;font-weight:500}
.wr-tile span{opacity:.75;font-size:12.5px}
.wr-song{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:var(--deck);border-radius:26px;padding:12px;margin-top:10px}
.wr-song .art.lg{width:110px;font-size:40px;border-radius:50%}
.wr-st{font:700 21px/1.15 var(--display);margin:4px 0 2px;overflow-wrap:anywhere}
.wr-song .wr-k{color:var(--mag-d);opacity:1}
.wr-list{list-style:none;margin:0;padding:0;counter-reset:n;display:flex;flex-direction:column;gap:4px}
.wr-list li{display:flex;align-items:center;gap:12px;counter-increment:n;min-height:58px}
.wr-list li::before{content:counter(n);font:700 18px var(--display);color:var(--cyan-d);width:20px;text-align:center;flex:none}
.wr-list .meta{flex:1;min-width:0}.wr-list .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wr-list .s{font-size:12.5px;color:var(--mute)}
.wr-tile.wide{background:var(--char);color:#fff}
.wr-bars{display:flex;align-items:flex-end;gap:3px;height:84px;margin-top:14px}
.wr-bars i{flex:1;background:linear-gradient(180deg,var(--cyan),var(--mag));border-radius:99px;min-height:6px;opacity:.9}
.wr-axis{display:flex;justify-content:space-between;font:500 11px var(--mono);opacity:.6;margin-top:6px}

#story{position:fixed;inset:0;z-index:55;background:var(--char);color:#fff;display:flex;justify-content:center;-webkit-user-select:none;user-select:none}
.st-in{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden;color:var(--char)}
.st-in.dark{color:#fff}
.st-prog{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;gap:4px;z-index:3}
.st-prog i{flex:1;height:3px;background:rgba(18,18,20,.18);border-radius:2px;overflow:hidden}
.st-prog i b{display:block;height:100%;width:0;background:var(--char)}
.st-in.dark .st-prog i{background:rgba(255,255,255,.28)}.st-in.dark .st-prog i b{background:#fff}
.st-prog i.done b{width:100%}.st-prog i.now b{animation:stfill 7s linear forwards}
@keyframes stfill{to{width:100%}}
.st-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);right:max(8px,env(safe-area-inset-right,0px));z-index:4;width:44px;height:44px;display:grid;place-items:center;color:inherit}
.slide{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 80px) 26px calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;justify-content:center;gap:12px;font-size:16px;line-height:1.45}
.slide .k{font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:600;opacity:.75}
.slide .xl{font:700 40px/1.05 var(--display);letter-spacing:-.03em;text-wrap:balance}
.slide .l{font:700 30px/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.slide .huge{font:800 104px/.92 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.slide .huge .of{font-size:42px;opacity:.5}
.slide .hint{margin-top:28px;font-size:12.5px;opacity:.6}
.slide .cov .art.lg{width:min(68vw,280px);box-shadow:0 0 0 10px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.4);font-size:72px;border-radius:50%}
.pop{opacity:0;transform:translateY(18px);animation:popin .6s cubic-bezier(.2,.8,.2,1) forwards}
.slide>.pop:nth-child(2){animation-delay:.12s}.slide>.pop:nth-child(3){animation-delay:.28s}.slide>.pop:nth-child(4){animation-delay:.45s}.slide>.pop:nth-child(5){animation-delay:.6s}.slide>.pop:nth-child(6){animation-delay:.75s}
@keyframes popin{to{opacity:1;transform:none}}
.s-a{background:radial-gradient(80% 60% at 100% 0%,rgba(228,63,211,.5),transparent 70%),radial-gradient(80% 60% at 0% 100%,rgba(34,211,197,.45),transparent 70%),#121214}
.s-b{background:#ffffff}
.s-c{background:linear-gradient(160deg,#22d3c5,#0b9c91)}
.s-d{background:radial-gradient(90% 60% at 50% 0%,rgba(34,211,197,.45),transparent 70%),#121214}
.s-e{background:#f4f5f7}
.s-f{background:linear-gradient(160deg,#e43fd3,#8f1a7e)}
.s-g{background:radial-gradient(90% 60% at 0% 0%,rgba(228,63,211,.45),transparent 70%),#121214}
.s-h{background:radial-gradient(100% 60% at 50% 100%,rgba(181,32,159,.5),transparent 65%),radial-gradient(60% 40% at 100% 0%,rgba(34,211,197,.35),transparent 70%),#121214}
.s-i{background:linear-gradient(160deg,#ffffff,#d9f7f4)}
.s-j{background:radial-gradient(80% 60% at 100% 0%,rgba(228,63,211,.5),transparent 70%),radial-gradient(80% 60% at 0% 100%,rgba(34,211,197,.45),transparent 70%),#121214}
.st-list{list-style:none;margin:6px 0 0;padding:0;counter-reset:n;display:flex;flex-direction:column;gap:12px}
.st-list li{display:flex;align-items:center;gap:12px;counter-increment:n}
.st-list li::before{content:counter(n);font:700 26px var(--display);width:26px;text-align:center;flex:none}
.st-list .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.st-list b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st-list small{opacity:.65;font-size:13px}
.st-list>li>span{font:500 13px var(--mono);opacity:.8}
.st-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;border-radius:23px;background:var(--char);color:#fff;font-weight:600;margin-top:6px}
.st-in.dark .st-btn{background:var(--cyan);color:var(--char)}
.st-bars-h{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:14px}
.st-bars-h i{flex:1;background:linear-gradient(180deg,var(--cyan),var(--mag));border-radius:99px}
.st-axis{display:flex;justify-content:space-between;font:500 12px var(--mono);opacity:.65}
.sum{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sum .k{font-size:11px}
.sum-top{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.sum-top .art.lg{width:120px;font-size:40px;border-radius:50%}
.sum small{display:block;font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.12em;margin-top:6px}
.sum b{display:block;font:600 19px/1.15 var(--display);overflow-wrap:anywhere}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-grid b{font-size:26px;font-weight:700;color:var(--cyan)}
.sum-list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:2px}
.sum-list li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvrow{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:4px}.lvrow>div{flex:1;min-width:0}.lvrow b{font:600 14px var(--display)}

.searchbox{position:relative;margin:2px 0 8px}
.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mute)}
.searchbox input{width:100%;height:50px;border-radius:25px;border:0;background:var(--deck);color:var(--fg);font:400 15px var(--body);padding:0 18px 0 46px;-webkit-user-select:text;user-select:text}
.searchbox input:focus{outline:2px solid var(--cyan)}

.card{background:var(--deck);border-radius:24px;padding:16px 18px;margin-top:28px;display:flex;flex-direction:column;gap:8px}
.card h4{margin:0;font:600 14px var(--display)}
.meter{height:8px;border-radius:4px;background:var(--deck-2);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mag));border-radius:4px}
.card .pill{background:#fff}.card .pill.amber{background:var(--char);color:#fff}

/* mini player: black card, cyan play */
#mini{margin:0 12px 8px;border-radius:22px;background:var(--char);color:#fff;position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:8px 8px 12px 8px;cursor:pointer;box-shadow:0 12px 30px rgba(18,18,20,.28)}
#mini .meta{flex:1;min-width:0}
#mini .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .s{font-size:12px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .art{width:44px;height:44px}
#mini .prog{position:absolute;left:16px;right:16px;bottom:5px;height:3px;background:rgba(255,255,255,.14);border-radius:2px}
#mini .prog i{display:block;height:100%;width:0;background:var(--cyan);border-radius:2px}
#mini .ib{color:#fff;width:38px;height:38px}
#mini #miniPlay{background:var(--cyan);color:var(--char);width:40px;height:40px}
#mini #miniLike.on{color:var(--mag)!important}

/* tab bar: white, labels for clarity, black bubble for the active tab */
nav#tabs{display:flex;justify-content:space-around;align-items:center;padding-block:6px 4px;background:var(--ink);border-top:1px solid var(--line)}
nav#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:76px;padding:4px 0;color:var(--mute);font-size:11px;font-weight:500}
nav#tabs button svg{width:42px;height:32px;padding:5px 10px;border-radius:16px;box-sizing:border-box;transition:background-color .2s ease,color .2s ease}
nav#tabs button[aria-current="page"]{color:var(--fg)}
nav#tabs button[aria-current="page"] svg{background:var(--char);color:var(--cyan)}

/* black scope: full player + queue */
#player,#qv{--ink:#121214;--deck:#1d1d21;--deck-2:#28282d;--glass:rgba(255,255,255,.07);--line:#2f2f35;--fg:#ffffff;--mute:#9a9ca4;--tape:#22d3c5;--tape-ink:#121214;color-scheme:dark;color:var(--fg)}
#player{position:fixed;inset:0;z-index:30;background:#121214;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#player.open{transform:none;visibility:visible}
#player .glow{position:absolute;inset:0;background:radial-gradient(70% 45% at 100% 0%,rgba(228,63,211,.35),transparent 70%),radial-gradient(70% 45% at 0% 60%,rgba(34,211,197,.22),transparent 70%),radial-gradient(60% 40% at 50% 30%,rgb(var(--c,34 211 197) / .25),transparent 70%);pointer-events:none;transition:background .6s ease}
#player .in{position:relative;flex:1;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);min-height:0}
.ph-top{display:flex;align-items:center;justify-content:space-between;height:52px}
.ph-top .ib{width:44px;height:44px;background:rgba(255,255,255,.08);color:var(--fg)}
.ph-top .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;font-weight:600;color:var(--mute);text-align:center;flex:1;min-width:0}
.ph-top .lbl b{display:block;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-art{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:20px 0}
.ph-art .art{width:min(84%,42vh);height:auto;aspect-ratio:1;border-radius:50%;font-size:72px;box-shadow:0 0 0 10px rgba(255,255,255,.05),0 0 0 22px rgba(255,255,255,.025),0 30px 70px rgba(0,0,0,.6);animation:spin 30s linear infinite}
.ph-art::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#121214;box-shadow:0 0 0 4px var(--cyan);pointer-events:none}
#player.paused .ph-art .art{animation-play-state:paused}
/* covers without artwork become records: grooves instead of the letter (the centre hole would cover it) */
.ph-art .art.ph,.feat .disc .art.ph{font-size:0;background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 0 1px,transparent 1.5px 7px),radial-gradient(circle at 30% 25%,rgba(255,255,255,.3),transparent 50%),linear-gradient(145deg,var(--a),var(--b))}
.ph-info{display:flex;align-items:center;gap:12px}
.ph-info .meta{flex:1;min-width:0;text-align:left}
.ph-info .t{font:700 24px/1.2 var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-info .s{color:var(--mute);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ph-info .ib{width:46px;height:46px;color:var(--fg)}
.ph-info .ib.on{color:var(--mag)!important}
.seek{margin-top:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--cyan) var(--p,0%),rgba(255,255,255,.14) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--cyan) var(--p,0%),rgba(255,255,255,.14) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 0 0 4px rgba(34,211,197,.3)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0}
.times{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums;margin-top:2px}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.ctrls .ib{width:50px;height:50px;color:var(--fg);position:relative}
.ctrls .ib.on{color:var(--cyan)}
.ctrls .ib.on::after{content:"";position:absolute;width:4px;height:4px;border-radius:2px;background:var(--cyan);transform:translateY(17px)}
.ctrls .main{width:74px;height:74px;border-radius:50%;background:var(--cyan);color:var(--char);display:grid;place-items:center;box-shadow:0 10px 34px rgba(34,211,197,.45)}
.ctrls .main:active{transform:scale(.94)}
.ph-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--mute);font-size:12px}
.ph-bottom .ib{color:var(--fg);background:rgba(255,255,255,.08)}
.fmt{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase}

#qv{position:fixed;inset:0;z-index:35;background:#121214;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#qv.open{transform:none}
.qv-in{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
.qv-top{display:flex;align-items:center;justify-content:space-between;height:56px;flex:none}
.qv-top .ib{background:rgba(255,255,255,.08)}
.qv-top b{font:600 17px var(--display)}
.qv-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:0 16px;min-height:0}
.qsec{font:600 17px var(--display);margin:14px 0 10px;display:block}
.qnow{display:flex;align-items:center;gap:12px;background:linear-gradient(110deg,rgba(34,211,197,.16),rgba(228,63,211,.12));border-radius:20px;padding:8px}.qnow .meta{flex:1;min-width:0}.qnow .t{font-weight:600;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qnow .s{font-size:12.5px;color:var(--mute)}
.qnow.paused .eq i{animation-play-state:paused}
.qhdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 6px;min-height:28px}
.qhdr .qsec{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qlink{color:var(--cyan);font-weight:500;font-size:13.5px;white-space:nowrap;padding:4px 0}
.qrow2{display:flex;align-items:center;gap:10px;min-height:62px;background:transparent;position:relative;border-radius:16px;padding:0 2px}
.qrow2.sel{background:rgba(34,211,197,.12)}
.qrow2.drag{background:var(--deck-2);box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:3}
.qrow2.swd{background:rgba(229,72,77,.25)}
.qck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.qck[aria-pressed="true"]{border:0}
.qtap{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer}
.qtap .meta{flex:1;min-width:0}.qtap .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qtap .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qnote{margin:16px 0 0}
.qv-foot{flex:none;padding-block:10px calc(env(safe-area-inset-bottom,0px) + 12px)}
.qctl{display:flex;align-items:center;justify-content:space-around;background:var(--deck);border-radius:34px;height:68px;padding:0 8px}
.qctl .ib{color:var(--fg);width:46px;height:46px}.qctl .ib.on{color:var(--cyan)}
.qplay{width:54px;height:54px;border-radius:50%;background:var(--cyan);color:var(--char);display:grid;place-items:center}
.qselbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:58px;background:var(--deck);border-radius:30px;padding:6px 8px 6px 18px}.qselbar span{flex:1;min-width:0}
#qv .pill{background:rgba(255,255,255,.1);color:var(--fg)}
#qv .pill.amber{background:var(--cyan);color:var(--char)}

#scrim{position:fixed;inset:0;background:rgba(18,18,20,.45);z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:28px 28px 0 0;max-height:84vh;overflow-y:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:760px;margin:0 auto;box-shadow:0 -10px 40px rgba(18,18,20,.15)}
#sheet.open{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sh-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sh-head .meta{min-width:0;flex:1}
.sh-head .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;text-align:left;font-size:15px;font-weight:500;border-radius:14px}
.opt:active{background:var(--deck)}
.opt svg{color:var(--mute);flex:none}
.opt.danger{color:var(--danger)}.opt.danger svg{color:var(--danger)}
.field{display:flex;flex-direction:column;gap:8px;padding:6px 0 4px}
.field label{font-weight:700;font-family:var(--display);font-size:20px;letter-spacing:-.01em}
.field input{height:50px;border-radius:16px;border:0;background:var(--deck);color:var(--fg);font:400 15px var(--body);padding:0 14px;-webkit-user-select:text;user-select:text}
.field input:focus{outline:2px solid var(--cyan)}
.sh-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.sh-acts .pill{height:46px;padding:0 20px;border-radius:23px;font-size:14.5px}
.pill.red{background:var(--danger);color:#fff}
.ef{display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.ef-l{font-size:12.5px;color:var(--mute);font-weight:500;margin-top:8px}
.ef-in{height:50px;border-radius:16px;border:0;background:var(--deck);color:var(--fg);font:400 15px var(--body);padding:0 14px;-webkit-user-select:text;user-select:text}
.ef-in:focus{outline:2px solid var(--cyan)}
.ef-swap{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;margin-top:6px;border-radius:18px;background:var(--char);color:var(--cyan);font-size:13px;font-weight:500}
.ef-cover{display:flex;align-items:center;gap:12px;margin:4px 0}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translate(-50%,12px);background:var(--char);color:#fff;font-weight:500;font-size:13.5px;padding:11px 18px;border-radius:22px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(18,18,20,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.92);display:grid;place-items:center;text-align:center}
#busy b{display:block;font:700 24px var(--display);margin-bottom:6px}
#busy .meter{width:220px;margin:12px auto 0}

@media (prefers-reduced-motion:reduce){#player,#sheet,#scrim,#toast,#qv{transition:none}.eq i{animation:none;height:8px}main.enter>*,.pop{animation:none;opacity:1;transform:none}.ph-art .art,.feat.live .disc,.wrcard.ready{animation:none}}

/* subtle ring so light and black covers keep an edge on either background */
.art.ph{box-shadow:inset 0 0 0 1px rgba(18,18,20,.06)}
/* ---------- dark theme: same layout, tokens recoloured ---------- */
:root[data-kz="dark"]{--ink:#0b0b0d;--deck:#18181c;--deck-2:#232328;--glass:#18181c;--line:#26262c;--fg:#f5f6f8;--mute:#9a9ca4;--tape:#22d3c5;--tape-ink:#121214;--shadow:0 8px 24px rgba(0,0,0,.45);color-scheme:dark}
:root[data-kz="dark"] .feat,:root[data-kz="dark"] .empty,:root[data-kz="dark"] .wrcard,:root[data-kz="dark"] .wr-hero,:root[data-kz="dark"] #mini,:root[data-kz="dark"] .wr-tile.wide,:root[data-kz="dark"] .wr-grid .wr-tile:nth-child(3){background-color:#16161a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
:root[data-kz="dark"] #mini{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.5)}
:root[data-kz="dark"] .pill.amber,:root[data-kz="dark"] .chip[aria-pressed="true"]{background:#fff;color:#121214}
:root[data-kz="dark"] .empty .pill.amber{background:var(--cyan)}
:root[data-kz="dark"] nav#tabs button[aria-current="page"] svg{background:var(--cyan);color:#121214}
:root[data-kz="dark"] .mode[aria-pressed="true"],:root[data-kz="dark"] .ef-swap{background:rgba(34,211,197,.15);color:var(--cyan)}
:root[data-kz="dark"] .banner,:root[data-kz="dark"] .impcard{background:rgba(34,211,197,.12);color:#c4f5f0}
:root[data-kz="dark"] .banner .ib{color:#c4f5f0}:root[data-kz="dark"] .impcard small{color:#8fd8d1}:root[data-kz="dark"] .impcard svg{color:var(--cyan)}
:root[data-kz="dark"] .row.swq{background:rgba(34,211,197,.18)}
:root[data-kz="dark"] .row.cur .t,:root[data-kz="dark"] .hero .kind,:root[data-kz="dark"] .wr-list li::before{color:var(--cyan)}
:root[data-kz="dark"] .wr-song .wr-k{color:var(--mag)}
:root[data-kz="dark"] #sheet{background:#141417}
:root[data-kz="dark"] .card .pill{background:var(--deck-2)}
:root[data-kz="dark"] #busy{background:rgba(11,11,13,.92)}
:root[data-kz="dark"] #toast{background:#fff;color:#121214}
:root[data-kz="dark"] .art.ph{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
:root[data-kz="dark"] .shelf .cover .art{box-shadow:0 10px 24px rgba(0,0,0,.55)}
:root[data-kz="dark"] .hero .art.lg,:root[data-kz="dark"] .hero .mosaic{box-shadow:0 18px 40px rgba(0,0,0,.55)}
/* tidy list header */
.pc3{display:flex;align-items:center;gap:4px;margin:16px 0 6px}
.pc3 .grow{flex:1}
.pc3 .pc-more{width:44px;height:44px;color:var(--fg);margin-left:-8px}
.tg{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.tg.on{color:var(--cyan-d)}
.tg.on::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:currentColor}
.pc3 .playbig{margin-left:8px}
.listbar{display:flex;justify-content:flex-end;margin:0 0 4px}
.sortbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:16px;color:var(--mute);font-size:12.5px;font-weight:500}
.sortbtn:active{background:var(--deck)}
.h3btn{cursor:pointer}
.heroact{display:flex;justify-content:center;margin-top:14px}
.libhead{display:flex;align-items:baseline;gap:8px;margin:2px 0 0}.libhead b{font:600 16px var(--display)}
:root[data-kz="dark"] .tg.on{color:var(--cyan)}
/* moods, collections, selection */
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moodcard{position:relative;height:84px;border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;color:var(--fgc);background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.28),transparent 45%),linear-gradient(145deg,var(--a),var(--b))}

/* ---------- tag parsing (ID3v2, MP4/M4A, FLAC) ---------- */
function dec(bytes,enc){

/* ---------- backup & restore ----------
   One .kazeta file: a text header (songs' info, playlists, plays, settings, file list) followed by the raw
   cover images and, optionally, the song files themselves. Restore matches songs by id or by file name+size. */
const BK_MAGIC='KAZETA-BACKUP1\n';
async function makeBackup(withSongs){
  let file;busy(true,'Creating backup',0,0);
  try{const files=[],parts=[];
    for(const [k,b] of await db.allKeyed('art')){files.push({kind:'art',key:k,size:b.size,type:b.type});parts.push(b);}
    if(withSongs){let i=0;for(const t of S.tracks){const b=await db.get('blobs',t.id);if(b){files.push({kind:'blob',key:t.id,size:b.size,type:b.type||t.type});parts.push(b);}busy(true,'Creating backup',++i,S.tracks.length);}}
    const settings={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('kazeta.'))settings[k.slice(7)]=localStorage.getItem(k);}}catch(e){}
    const plays=await db.all('plays').catch(()=>[]);
    const head={app:'kazeta',v:1,created:Date.now(),version:VERSION,withSongs:!!withSongs,tracks:S.tracks,playlists:S.playlists,plays,settings,files};
    const hb=new TextEncoder().encode(JSON.stringify(head));
    const d=new Date(),p2=x=>String(x).padStart(2,'0');
    file=new File([BK_MAGIC,String(hb.length).padStart(12,'0'),hb,...parts],`Kazeta backup ${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}.kazeta`,{type:'application/octet-stream'});
    S.bkFile=file;LS.set('lastBackup',Date.now());}
  catch(e){busy(false);toast("The backup couldn't be created. There may not be enough free space.");return;}
  busy(false);
  openSheet(`<div class="field"><label>Backup ready</label><p class="muted" style="margin:0">${esc(file.name)} · ${mb(file.size)}${withSongs?' · includes song files':''}. Tap <b>Save backup</b>, then choose <b>Save to Files</b>.</p></div><div class="sh-acts"><button class="pill" data-act="closeSheet">Close</button><button class="pill amber" data-act="saveBackup">${ic('save',16)}Save backup</button></div>`);
  if(view().type==='settings')render();
}
function saveBackupFile(){const f=S.bkFile;if(!f)return;
  const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},5000);closeSheet();toast('Backup downloaded');};
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Kazeta backup'}).then(()=>{closeSheet();toast('Backup saved');}).catch(e=>{if(e&&e.name==='AbortError')return;dl();});return;}}catch(e){}
  dl();}
async function readBackup(file){
  try{if((await file.slice(0,BK_MAGIC.length).text())!==BK_MAGIC)throw 0;
    const len=parseInt(await file.slice(BK_MAGIC.length,BK_MAGIC.length+12).text(),10),start=BK_MAGIC.length+12;
    const H=JSON.parse(await file.slice(start,start+len).text());if(H.app!=='kazeta')throw 0;
    S.bkPending={file,H,base:start+len};
    const d=new Date(H.created).toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
    openSheet(`<div class="field"><label>Restore backup from ${d}?</label><p class="muted" style="margin:0">${plural(H.tracks.length,'song')}${H.withSongs?' with their files':' (info only, no song files)'}, ${plural(H.playlists.length,'playlist')}, ${plural((H.plays||[]).length,'play')} for Wrapped.<br>Songs already in Kazeta keep playing and get their saved names, likes, moods and stats back.${H.withSongs?' Missing songs are added from the backup.':' Songs that aren\'t in Kazeta any more need to be imported first.'}</p></div><div class="sh-acts"><button class="pill" data-act="closeSheet">Cancel</button><button class="pill amber" data-act="restoreYes">Restore</button></div>`);}
  catch(e){toast("That file isn't a Kazeta backup.");}
}
async function applyBackup(){const B=S.bkPending;if(!B)return;const {file,H,base}=B;let matched=0,added=0,missing=0;
  busy(true,'Restoring',0,H.tracks.length);
  try{const at=new Map();let off=base;for(const f of H.files){at.set(f.kind+':'+f.key,{s:off,n:f.size,type:f.type});off+=f.size;}
    const slice=async(a,type)=>new Blob([await file.slice(a.s,a.s+a.n).arrayBuffer()],{type});
    const artKeys=new Set();for(const f of H.files)if(f.kind==='art'){await db.put('art',await slice(at.get('art:'+f.key),f.type||'image/jpeg'),f.key);artKeys.add(f.key);}
    const bySig=new Map(S.tracks.map(t=>[t.sig,t])),idMap=new Map(),upd=[];let i=0;
    for(const bt of H.tracks){busy(true,'Restoring',++i,H.tracks.length);
      const t=S.byId.get(bt.id)||bySig.get(bt.sig);
      if(t){idMap.set(bt.id,t.id);Object.assign(t,{title:bt.title,artist:bt.artist,album:bt.album,albumArtist:bt.albumArtist,liked:bt.liked,likedAt:bt.likedAt,mo:bt.mo,edited:bt.edited,order:bt.order,plays:Math.max(t.plays||0,bt.plays||0),lastPlayed:Math.max(t.lastPlayed||0,bt.lastPlayed||0)});if(bt.artKey&&artKeys.has(bt.artKey)){t.artKey=bt.artKey;t.color=bt.color;}upd.push(t);matched++;}
      else{const a=at.get('blob:'+bt.id);if(a){await db.put('blobs',await slice(a,a.type||bt.type||'audio/mpeg'),bt.id);upd.push({...bt});idMap.set(bt.id,bt.id);added++;}else missing++;}}
    await db.putMany('tracks',upd);
    const pls=H.playlists.map(bp=>({...bp,ids:bp.ids.map(id=>idMap.get(id)).filter(Boolean),addedAt:Object.fromEntries(Object.entries(bp.addedAt||{}).map(([k,v])=>[idMap.get(k),v]).filter(([k])=>k))}));
    await db.putMany('playlists',pls);
    const have=new Set((await db.all('plays').catch(()=>[])).map(p=>p.id));
    await db.putMany('plays',(H.plays||[]).filter(p=>!have.has(p.id)).map(p=>({...p,tid:idMap.get(p.tid)||p.tid})));
    for(const [k,v] of Object.entries(H.settings||{})){if(k==='session'||k==='lastImport')continue;try{localStorage.setItem('kazeta.'+k,v);}catch(e){}}
  }catch(e){busy(false);toast("The backup couldn't be restored completely.");console.warn(e);}
  busy(false);S.bkPending=null;await loadAll();await loadRecent();S.shuffle=LS.get('shuffle',false);S.repeat=LS.get('repeat','all');applyTheme();render();updateNow();analyzeLibrary();
  toast(`Restored ${plural(matched+added,'song')}${added?` (${added} added from the backup)`:''}${missing?`. ${missing} not found: import them and restore again`:''}`);
}

  const rest=C.ids.slice(C.i+1).filter((_,j)=>keep('c:'+(C.i+1+j)));C.ids=C.ids.slice(0,C.i+1).concat(rest);
  if(!S.shuffle)C.base=C.ids.slice();}
const HANDLE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>';

function renderQ(){

function renderQFoot(){if(!qOpen)return;const f=$('#qvFoot');
  if(qSel.size){const anyC=[...qSel].some(k=>k.startsWith('c:'));
    f.innerHTML=`<div class="qselbar"><span class="muted">${plural(qSel.size,'song')} selected</span><button class="pill" data-act="qrmSel">${ic('trash',16)}Remove</button>${anyC?`<button class="pill amber" data-act="qaddSel">${ic('addq',16)}Add to queue</button>`:''}</div>`;return;}

function bindQDrag(){
  const list=$('#qdl'),body=$('#qvBody');if(!list)return;
  list.querySelectorAll('.qh').forEach(h=>h.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    const row=h.closest('.qrow2');let lastY=e.clientY,raf=0;row.classList.add('drag');
    const place=()=>{const cands=[...list.children].filter(el=>el!==row&&(el.classList.contains('qrow2')||el.classList.contains('qsep')));
      let before=null;for(const el of cands){const r=el.getBoundingClientRect();if(lastY<r.top+r.height/2){before=el;break;}}
      if(before){if(row.nextElementSibling!==before)list.insertBefore(row,before);}else if(list.lastElementChild!==row)list.appendChild(row);};
    const tick=()=>{const b=body.getBoundingClientRect();if(lastY<b.top+60)body.scrollTop-=8;else if(lastY>b.bottom-60)body.scrollTop+=8;place();raf=requestAnimationFrame(tick);};
    raf=requestAnimationFrame(tick);
    const move=ev=>{lastY=ev.clientY;};
    /* listen on window: moving the row in the list would drop a pointer capture on the handle */
    const up=()=>{cancelAnimationFrame(raf);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);row.classList.remove('drag');
      const C=S.ctx,uq=[],rest=[];let after=false;
      for(const el of list.children){if(el.classList.contains('qsep')){after=true;continue;}if(!el.classList.contains('qrow2'))continue;(after?rest:uq).push(el.dataset.id);}
      const moved=uq.join()!==S.uq.join()||rest.join()!==C.ids.slice(C.i+1).join();
      if(moved){S.uq=uq;C.ids=C.ids.slice(0,C.i+1).concat(rest);if(!S.shuffle)C.base=C.ids.slice();qSel.clear();afterQueueChange();}};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  }));
}

async function deleteTrack(id){
  const t=S.byId.get(id);if(!t)return;
  if(curId()===id){exitSoft();audio.pause();audio.removeAttribute('src');audio.load();}
  {const C=S.ctx,before=C.ids.slice(0,Math.max(0,C.i+1)).filter(x=>x===id).length;
   C.ids=C.ids.filter(x=>x!==id);C.base=C.base.filter(x=>x!==id);S.uq=S.uq.filter(x=>x!==id);C.i=Math.max(-1,C.i-before);
   if(S.cur&&S.cur.id===id)S.cur=null;}
  await db.del('blobs',id);await db.del('tracks',id);
  for(const p of S.playlists)if(p.ids.includes(id)){p.ids=p.ids.filter(x=>x!==id);await db.put('playlists',p);}
  if(t.artKey&&!S.tracks.some(x=>x.id!==id&&x.artKey===t.artKey)){await db.del('art',t.artKey);const u=S.artURL.get(t.artKey);if(u)URL.revokeObjectURL(u);S.artURL.delete(t.artKey);}
  S.tracks=S.tracks.filter(x=>x.id!==id);S.byId.delete(id);prepareNext();
}

    try{const r=await processArt(f);const key='tr:'+t.id+':'+Date.now();await db.put('art',r.blob,key);
      const old=t.artKey;S.artURL.set(key,URL.createObjectURL(r.blob));t.artKey=key;t.color=r.color;await db.put('tracks',t);
      if(old&&old.startsWith('tr:')&&!S.tracks.some(x=>x.artKey===old)){await db.del('art',old).catch(()=>{});const u=S.artURL.get(old);if(u)URL.revokeObjectURL(u);S.artURL.delete(old);}
      const ea=$('#efArt');if(ea)ea.innerHTML=art(t,'md');render();if(curId()===t.id){updateNow();setMS(t);}toast('Cover updated');}
    catch(err){toast("That image couldn't be opened. Try another photo.");}return;}
  const p=S.playlists.find(p=>p.id===S.coverFor);if(!f||!p)return;
  try{const r=await processArt(f);const key='pl:'+p.id+':'+Date.now();await db.put('art',r.blob,key);
    if(p.cover){await db.del('art',p.cover).catch(()=>{});const u=S.artURL.get(p.cover);if(u)URL.revokeObjectURL(u);S.artURL.delete(p.cover);}
    S.artURL.set(key,URL.createObjectURL(r.blob));p.cover=key;await savePl(p);render();toast('Cover updated');}
  catch(err){toast("That image couldn't be opened. Try another photo.");}});
$('#file').addEventListener('change',e=>{const f=e.target.files;if(f&&f.length)importFiles(f);e.target.value='';});
/* swipe left = next song, swipe right = previous (mini player and big artwork) */
let swiped=false;
function swipeSkip(el,slideEl){let x0=null,y0=0;
  el.addEventListener('touchstart',e=>{if(e.target.closest('button,input'))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchmove',e=>{if(x0==null)return;const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;if(Math.abs(dx)>Math.abs(dy)&&slideEl)slideEl.style.transform=`translateX(${dx*0.6}px)`;},{passive:true});
  el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(slideEl){slideEl.style.transition='transform .2s';slideEl.style.transform='';setTimeout(()=>{slideEl.style.transition='';},220);}
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3){swiped=true;setTimeout(()=>{swiped=false;},400);if(dx<0)next();else prev();}},{passive:true});}
swipeSkip($('#mini'),$('#mini .meta'));swipeSkip($('#phArt'),$('#phArt'));
/* swipe right on a song = Add to queue (like Spotify); swipe left on a queue row = remove */
let swallow=false;
(()=>{let r=null,x0=0,y0=0,dx=0,on=false;
  const start=(row,e)=>{r=row;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;on=false;};
  const move=(e,dir)=>{if(!r)return;dx=e.touches[0].clientX-x0;const dy=e.touches[0].clientY-y0;if(!on&&Math.abs(dy)>Math.abs(dx)){r=null;return;}
    if(dx*dir>8){on=true;r.style.transform=`translateX(${dir>0?Math.min(dx,120):Math.max(dx,-120)}px)`;r.classList.toggle(dir>0?'swq':'swd',dx*dir>80);}};
  const end=(fn,dir)=>{if(!r)return;const row=r;r=null;row.style.transition='transform .2s';row.style.transform='';setTimeout(()=>{row.style.transition='';row.classList.remove('swq','swd');},220);
    if(on){swallow=true;setTimeout(()=>{swallow=false;},350);}if(dx*dir>80)fn(row);};
  const m=$('#main');
  m.addEventListener('touchstart',e=>{const row=e.target.closest('.row[data-tid]');if(row&&!e.target.closest('button'))start(row,e);},{passive:true});
  m.addEventListener('touchmove',e=>move(e,1),{passive:true});
  m.addEventListener('touchend',()=>end(row=>A.addq({dataset:{id:row.dataset.tid}}),1),{passive:true});
  const q=$('#qvBody');
  q.addEventListener('touchstart',e=>{const row=e.target.closest('.qrow2');if(row&&!e.target.closest('.qh,.qck'))start(row,e);},{passive:true});
  q.addEventListener('touchmove',e=>move(e,-1),{passive:true});
  q.addEventListener('touchend',()=>end(row=>{const k=row.dataset.key;qApply(x=>x!==k);qSel.delete(k);afterQueueChange();toast('Removed from queue');},-1),{passive:true});
})();
/* long-press a song (or right-click) to start selecting */
(()=>{let tm=0,x0=0,y0=0,row=null;const m=$('#main');
  m.addEventListener('touchstart',e=>{const r=e.target.closest('.row[data-tid]');if(!r||e.target.closest('button')||S.sel)return;row=r;x0=e.touches[0].clientX;y0=e.touches[0].clientY;clearTimeout(tm);
    tm=setTimeout(()=>{if(!row)return;swallow=true;setTimeout(()=>{swallow=false;},700);const id=row.dataset.tid;row=null;enterSel(id);},480);},{passive:true});
  m.addEventListener('touchmove',e=>{if(row&&(Math.abs(e.touches[0].clientX-x0)>10||Math.abs(e.touches[0].clientY-y0)>10)){clearTimeout(tm);row=null;}},{passive:true});
  m.addEventListener('touchend',()=>{clearTimeout(tm);row=null;},{passive:true});
  m.addEventListener('contextmenu',e=>{const r=e.target.closest('.row[data-tid]');if(!r)return;e.preventDefault();if(!S.sel)enterSel(r.dataset.tid);});
})();
/* swipe down to close the player */
(()=>{let y0=null;const p=$('#player');p.addEventListener('touchstart',e=>{if(e.target.closest('input'))return;y0=e.touches[0].clientY;},{passive:true});p.addEventListener('touchend',e=>{if(y0!=null&&e.changedTouches[0].clientY-y0>110)closePlayer();y0=null;},{passive:true});})();

/* ---------- boot ---------- */
(async()=>{
  try{await openDB();}catch(e){useMem=true;}
  try{await loadAll();}catch(e){useMem=true;await loadAll();}
  for(const t of S.tracks){const c=cleanTitle(t.title);if(c!==t.title){t.title=c;db.put('tracks',t).catch(()=>{});}}
  const li=LS.get('lastImport',null);if(li&&li.ids){S.lastImport=li.ids.filter(id=>S.byId.has(id));S.lastImportAt=li.at||0;}
  const s=LS.get('session',null);
  if(s&&(s.ctx||s.queue)){const ok=id=>S.byId.has(id);
    if(s.ctx){const oc=s.ctx.ids[s.ctx.i];S.ctx={ids:(s.ctx.ids||[]).filter(ok),base:(s.ctx.base||[]).filter(ok),i:-1};S.ctx.i=oc?S.ctx.ids.indexOf(oc):-1;
      S.uq=(s.uq||[]).filter(ok);if(s.cur&&ok(s.cur.id))S.cur={id:s.cur.id,q:!!s.cur.q};}
    else{const cid=s.queue[s.qi];S.ctx={ids:s.queue.filter(ok),base:(s.base||[]).filter(ok),i:-1};S.ctx.i=S.ctx.ids.indexOf(cid);if(S.ctx.i>=0)S.cur={id:cid,q:false};}
    if(!S.ctx.base.length)S.ctx.base=S.ctx.ids.slice();S.from=s.from||'Your library';
    if(S.cur)await loadCur(false,s.time);}
  await loadRecent();applyTheme();render();updateNow();
  setTimeout(()=>analyzeLibrary(),2500);
  if(isPWAFile&&'serviceWorker' in navigator){
    const hadCtl=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!reloaded&&audio.paused){reloaded=true;location.reload();}});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      swReg=reg;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
    }).catch(()=>{});
  }
})();
})();
</script>
