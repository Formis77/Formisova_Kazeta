<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kazeta">
<meta name="theme-color" content="#e7defa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Kazeta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Kazeta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap">
<style>
/* Layout: one-screen app shell. Pastel lavender→cream ground, white glass cards, a dark floating tab bar,
   and a charcoal "night" scope for the full player and queue. A deliberate single (light + dark scope) look. */
:root{
  --lav:#c4b4f4; --lav-d:#7d62d8; --butter:#f3cf62; --mauve:#e4bccf; --peach:#f6c6a5; --char:#1d1c22;
  --ink:#f1ecf6;          /* page base */
  --deck:#ffffff;         /* cards */
  --deck-2:#ece6f4;       /* pressed / soft fills */
  --glass:rgba(255,255,255,.72);
  --line:#e2dbec;
  --fg:#1d1c22;
  --mute:#77727f;
  --tape:#7d62d8;         /* accent for text, checks, playing state */
  --tape-ink:#ffffff;
  --danger:#d9485f;
  --shadow:0 10px 30px rgba(80,60,130,.10);
  --ground:linear-gradient(180deg,#e7defa 0%,#efe9f6 38%,#f7f0e3 78%,#f9edd0 100%);
  --display:"Outfit", "Avenir Next", system-ui, sans-serif;
  --body:"Outfit", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono:"Outfit", -apple-system, system-ui, sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ground) var(--ink);background-attachment:fixed;color:var(--fg);font:400 15px/1.4 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;transition:transform .15s ease,background-color .2s ease,color .2s ease}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--tape);outline-offset:2px;border-radius:10px}
svg{display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding-block:12px 8px;min-height:64px}
.top h1{flex:1;margin:0;font:500 22px/1.1 var(--display);letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top h1.logo{display:flex;align-items:center;gap:9px;font:500 23px/1 var(--display);letter-spacing:-.02em}
.top h1.logo svg{flex:none}
.top .back,.cb{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--glass);box-shadow:0 2px 10px rgba(80,60,130,.08);flex:none;color:var(--fg)}
.top .back{margin-left:-2px}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:19px;background:var(--deck);font-weight:500;font-size:14px;white-space:nowrap;box-shadow:0 1px 4px rgba(80,60,130,.06)}
.pill.amber{background:var(--char);color:#fff}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:4px 24px;min-height:0}
h2{font:500 20px/1.2 var(--display);letter-spacing:-.01em;margin:28px 0 12px}
.muted{color:var(--mute)}
.small{font-size:13px}

/* entrance motion when moving between screens */
main.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.05s}main.enter>*:nth-child(3){animation-delay:.1s}main.enter>*:nth-child(4){animation-delay:.15s}main.enter>*:nth-child(5){animation-delay:.2s}main.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* art */
.art{flex:none;border-radius:12px;object-fit:cover;background:var(--deck-2);display:grid;place-items:center;overflow:hidden;font:500 18px var(--display);color:var(--char)}
.art.ph{background:radial-gradient(120% 90% at 20% 15%,rgba(255,255,255,.55),transparent 55%),linear-gradient(145deg,var(--a,#c4b4f4),var(--b,#a58bef));color:var(--fgc,#1d1c22)}
.art.sm{width:48px;height:48px;font-size:18px}
.art.md{width:56px;height:56px;border-radius:14px}
.art.lg{width:100%;aspect-ratio:1;max-width:100%;font-size:48px;border-radius:22px;font-weight:400}
.art.round{border-radius:50%}
.art.liked{background:linear-gradient(140deg,#c4b4f4,#e4bccf 55%,#f3cf62);color:var(--char)}

/* rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:6px 6px;margin:0 -6px;min-height:62px;cursor:pointer;border-radius:16px;transition:background-color .2s ease,transform .2s ease}
.row:active{background:var(--glass)}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.cur .t{color:var(--tape)}
.row .lk{color:var(--tape)}
.row.swq{background:#e3dafb}
.dur{font:400 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--mute);flex:none}
.ib:active{background:var(--deck-2)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px;vertical-align:-1px}
.eq i{width:3px;background:var(--tape);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* home */
.hello{font:300 38px/1.04 var(--display);letter-spacing:-.025em;margin:4px 0 20px;text-wrap:balance}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;background:var(--glass);border-radius:18px;overflow:hidden;min-width:0;height:62px;padding:6px;text-align:left;font-weight:500;font-size:14px;box-shadow:0 2px 10px rgba(80,60,130,.05)}
.tile .art{border-radius:13px;width:50px!important;height:50px!important}
.tile span{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding-right:6px;line-height:1.25}
.shelf{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.shelf::-webkit-scrollbar{display:none}
.cover{flex:none;width:138px;scroll-snap-align:start;text-align:left}
.cover .art{width:138px;height:138px;border-radius:24px}
.cover b{display:block;font-weight:500;font-size:14px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}
.grid2 .cover{width:auto}
.grid2 .cover .art{width:100%;height:auto;aspect-ratio:1}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:24px 22px 26px;background:var(--glass);border-radius:28px;margin-top:8px;box-shadow:var(--shadow)}
.empty h3{margin:0;font:400 26px/1.1 var(--display);letter-spacing:-.02em}
.empty p{margin:0;color:var(--mute);max-width:46ch}
.empty .acts{display:flex;flex-wrap:wrap;gap:8px}
.cassette{width:150px;height:96px;margin-bottom:4px}
.steps{margin:0;padding-left:20px;color:var(--mute);display:flex;flex-direction:column;gap:4px}

.banner{display:flex;gap:10px;align-items:flex-start;background:#fbf0cc;color:#5a4710;border-radius:18px;padding:12px 8px 12px 14px;font-size:13px;margin:4px 0 14px}
.banner p{margin:0;flex:1}
.banner .ib{width:28px;height:28px;color:#5a4710}

/* chips: dark pill = selected, white = not */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px 0 16px;padding:2px 0}
.chip{height:40px;padding:0 18px;border-radius:20px;background:var(--deck);font-size:14px;font-weight:500;white-space:nowrap;flex:none;box-shadow:0 1px 4px rgba(80,60,130,.06)}
.chip[aria-pressed="true"]{background:var(--char);color:#fff}
.chip.sm{height:32px;padding:0 13px;font-size:13px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar .grow{flex:1;min-width:0}
.playbig{width:56px;height:56px;border-radius:50%;background:var(--char);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 20px rgba(29,28,34,.25)}
.playbig:active{transform:scale(.95)}

/* detail header */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:4px}
.hero .art.lg,.hero .mosaic{width:min(62vw,240px);box-shadow:0 16px 40px rgba(80,60,130,.18)}
.hero .kind{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);margin-top:14px;font-weight:500}
.hero h3{margin:0;font:300 32px/1.08 var(--display);letter-spacing:-.025em;text-wrap:balance}
.hero .sub{color:var(--mute);font-size:14px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1;border-radius:22px;overflow:hidden;max-width:100%}
.mosaic .art{width:100%;height:100%;border-radius:0}
.pc2{display:flex;align-items:center;gap:10px;margin:18px 0 0}
.pc-modes{display:flex;gap:8px;flex:1;min-width:0}
.mode{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:74px;height:60px;border-radius:20px;background:var(--glass);color:var(--mute);font-size:12px;font-weight:500;position:relative;box-shadow:0 1px 4px rgba(80,60,130,.06)}
.mode[aria-pressed="true"]{color:var(--char);background:var(--lav)}
.mode:active{transform:scale(.96)}
.pc2 .playbig{width:60px;height:60px}
.pc-cap{font-size:13px;color:var(--mute);margin:8px 0 12px}
.coverbtn{position:relative;display:block;width:min(62vw,240px);max-width:100%;border-radius:22px}
.coverbtn .art.lg,.coverbtn .mosaic{width:100%}
.coverbtn>span{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;background:rgba(29,28,34,.75);color:#fff;display:grid;place-items:center}
.sortbar{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px 0 10px;padding:2px 0}.sortbar::-webkit-scrollbar{display:none}
.textbtns{display:flex;gap:6px;flex-wrap:wrap}
.qh{width:40px;height:44px;display:grid;place-items:center;color:var(--mute);touch-action:none;flex:none;cursor:grab}
.ck{display:inline-block;vertical-align:-2px;margin-right:4px}.ck svg{display:inline}
.ckempty{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt .ckc{color:inherit}

/* import + wrapped cards: tilted pastel cards like the reference */
.impcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--deck);border-radius:22px;padding:10px 14px 10px 10px;margin-bottom:14px;box-shadow:var(--shadow),inset 0 0 0 1.5px var(--lav)}
.impcard .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.impcard b{font:500 16px var(--display)}.impcard small{color:var(--mute);font-size:13px}
.impcard svg{color:var(--tape)}
.wrcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:28px;padding:20px 16px 20px 20px;margin-top:18px;background:linear-gradient(150deg,#c9b8f6 0%,#dccdf2 35%,#f6e4a6 100%);color:var(--char);transform:rotate(-1.6deg);box-shadow:0 14px 34px rgba(120,90,190,.18);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.wrcard:active{transform:rotate(0) scale(.98)}
.wrcard .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.wrcard b{font:500 22px/1.1 var(--display);letter-spacing:-.015em;text-transform:uppercase}.wrcard small{font-size:13px;opacity:.75}
.wrcard>svg{width:42px;height:42px;padding:10px;border-radius:50%;border:1.5px solid rgba(29,28,34,.25);flex:none}
.wrcard.ready{margin:0 0 16px;transform:rotate(1.4deg);background:linear-gradient(150deg,#e4bccf 0%,#d7c6f4 55%,#f3cf62 120%);animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 14px 34px rgba(120,90,190,.18),0 0 0 4px rgba(196,180,244,.6)}}

/* wrapped screen */
.wr-hero{border-radius:28px;padding:22px 20px;background:linear-gradient(150deg,#c9b8f6 0%,#e2d6f5 45%,#f6e4a6 100%);color:var(--char);box-shadow:var(--shadow)}
.wr-hero p{margin:8px 0 0;opacity:.75}
.wr-k{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:500;opacity:.7}
.wr-big{font:300 72px/1 var(--display);letter-spacing:-.04em;margin-top:12px;font-variant-numeric:tabular-nums}
.wr-unit{font:400 18px var(--display);margin-top:2px}
.wr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.wr-tile{background:var(--deck);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--char)}
.wr-grid .wr-tile:nth-child(1){background:var(--butter)}.wr-grid .wr-tile:nth-child(2){background:var(--mauve)}.wr-grid .wr-tile:nth-child(3){background:var(--lav)}.wr-grid .wr-tile:nth-child(4){background:var(--peach)}
.wr-tile b{font:300 34px/1.05 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.wr-tile b small{font-size:17px;opacity:.6;font-weight:400}
.wr-tile span{opacity:.7;font-size:13px}
.wr-song{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:var(--glass);border-radius:26px;padding:12px;margin-top:10px;box-shadow:var(--shadow)}
.wr-song .art.lg{width:110px;font-size:40px;border-radius:18px}
.wr-st{font:400 23px/1.15 var(--display);margin:4px 0 2px;overflow-wrap:anywhere}
.wr-song .wr-k{color:var(--tape);opacity:1}
.wr-list{list-style:none;margin:0;padding:0;counter-reset:n;display:flex;flex-direction:column;gap:4px}
.wr-list li{display:flex;align-items:center;gap:12px;counter-increment:n;min-height:58px}
.wr-list li::before{content:counter(n);font:300 22px var(--display);color:var(--tape);width:20px;text-align:center;flex:none}
.wr-list .meta{flex:1;min-width:0}.wr-list .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wr-list .s{font-size:13px;color:var(--mute)}
.wr-tile.wide{background:linear-gradient(170deg,#e6dcfa,#f5ecd6);box-shadow:var(--shadow)}
.wr-bars{display:flex;align-items:flex-end;gap:3px;height:84px;margin-top:14px}
.wr-bars i{flex:1;background:#fff;border-radius:99px;position:relative;min-height:6px}
.wr-bars i::before{content:"";position:absolute;top:-2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--butter)}
.wr-axis{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--mute);margin-top:6px}

/* story */
#story{position:fixed;inset:0;z-index:55;background:var(--char);color:var(--char);display:flex;justify-content:center;-webkit-user-select:none;user-select:none}
.st-in{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden}
.st-in.dark{color:#fff}
.st-prog{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;gap:4px;z-index:3}
.st-prog i{flex:1;height:3px;background:rgba(29,28,34,.18);border-radius:2px;overflow:hidden}
.st-prog i b{display:block;height:100%;width:0;background:var(--char)}
.st-in.dark .st-prog i{background:rgba(255,255,255,.28)}.st-in.dark .st-prog i b{background:#fff}
.st-prog i.done b{width:100%}.st-prog i.now b{animation:stfill 7s linear forwards}
@keyframes stfill{to{width:100%}}
.st-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);right:max(8px,env(safe-area-inset-right,0px));z-index:4;width:44px;height:44px;display:grid;place-items:center;color:inherit}
.slide{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 80px) 26px calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;justify-content:center;gap:12px;font-size:17px;line-height:1.4}
.slide .k{font-size:13px;text-transform:uppercase;letter-spacing:.14em;font-weight:500;opacity:.7}
.slide .xl{font:300 44px/1.02 var(--display);letter-spacing:-.03em;text-wrap:balance}
.slide .l{font:400 32px/1.08 var(--display);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.slide .huge{font:200 112px/.9 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.slide .huge .of{font-size:44px;opacity:.5}
.slide .hint{margin-top:28px;font-size:13px;opacity:.6}
.slide .cov .art.lg{width:min(68vw,280px);box-shadow:0 24px 60px rgba(29,28,34,.3);font-size:72px;border-radius:28px}
.pop{opacity:0;transform:translateY(18px);animation:popin .6s cubic-bezier(.2,.8,.2,1) forwards}
.slide>.pop:nth-child(2){animation-delay:.12s}.slide>.pop:nth-child(3){animation-delay:.28s}.slide>.pop:nth-child(4){animation-delay:.45s}.slide>.pop:nth-child(5){animation-delay:.6s}.slide>.pop:nth-child(6){animation-delay:.75s}
@keyframes popin{to{opacity:1;transform:none}}
.s-a{background:linear-gradient(160deg,#c9b8f6,#e7dcf6 50%,#f6e4a6)}
.s-b{background:radial-gradient(90% 60% at 85% 10%,rgba(196,180,244,.45),transparent 60%),linear-gradient(170deg,#2a2930,#141317)}
.s-c{background:linear-gradient(160deg,#f6e4a6,#f6c6a5)}
.s-d{background:radial-gradient(90% 60% at 15% 85%,rgba(243,207,98,.35),transparent 60%),linear-gradient(180deg,#26252b,#131216)}
.s-e{background:linear-gradient(170deg,#c6d3fa,#c9b8f6)}
.s-f{background:radial-gradient(90% 60% at 80% 20%,rgba(228,188,207,.4),transparent 60%),linear-gradient(160deg,#28272d,#121115)}
.s-g{background:linear-gradient(170deg,#e4bccf,#f6c6a5)}
.s-h{background:radial-gradient(100% 60% at 50% 100%,rgba(196,180,244,.45),transparent 65%),linear-gradient(180deg,#1d1c22,#25242b)}
.s-i{background:linear-gradient(160deg,#f3cf62,#d7c6f4)}
.s-j{background:linear-gradient(160deg,#c9b8f6,#e4bccf 55%,#f6e4a6)}
.st-list{list-style:none;margin:6px 0 0;padding:0;counter-reset:n;display:flex;flex-direction:column;gap:12px}
.st-list li{display:flex;align-items:center;gap:12px;counter-increment:n}
.st-list li::before{content:counter(n);font:300 30px var(--display);width:26px;text-align:center;flex:none}
.st-list .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.st-list b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st-list small{opacity:.7;font-size:14px}
.st-list>li>span{font:400 14px var(--mono);opacity:.8}
.st-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;border-radius:23px;background:var(--char);color:#fff;font-weight:500;margin-top:6px}
.st-in.dark .st-btn{background:#fff;color:var(--char)}
.st-bars-h{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:14px}
.st-bars-h i{flex:1;background:#fff;opacity:.92;border-radius:99px}
.st-axis{display:flex;justify-content:space-between;font:400 12px var(--mono);opacity:.7}
.sum{background:rgba(29,28,34,.9);color:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sum .k{font-size:12px}
.sum-top{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.sum-top .art.lg{width:120px;font-size:40px;border-radius:20px}
.sum small{display:block;font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.sum b{display:block;font:400 20px/1.15 var(--display);overflow-wrap:anywhere}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-grid b{font-size:26px;font-weight:300;color:var(--butter)}
.sum-list{margin:0;padding-left:22px;font-weight:400;display:flex;flex-direction:column;gap:2px}
.sum-list li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvrow{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:4px}.lvrow>div{flex:1;min-width:0}.lvrow b{font:500 15px var(--display)}

/* search */
.searchbox{position:relative;margin:2px 0 8px}
.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mute)}
.searchbox input{width:100%;height:52px;border-radius:26px;border:0;background:var(--deck);color:var(--fg);font:400 16px var(--body);padding:0 18px 0 46px;box-shadow:var(--shadow);-webkit-user-select:text;user-select:text}
.searchbox input:focus{outline:2px solid var(--lav)}

/* storage card */
.card{background:var(--glass);border-radius:26px;padding:16px 18px;margin-top:28px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.card h4{margin:0;font:500 15px var(--display)}
.meter{height:8px;border-radius:4px;background:var(--deck-2);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--lav),var(--butter));border-radius:4px}

/* mini player: frosted card above the dark tab bar */
#mini{margin:0 12px 8px;border-radius:22px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:8px 6px 11px 8px;cursor:pointer;box-shadow:0 10px 30px rgba(80,60,130,.16)}
#mini .meta{flex:1;min-width:0}
#mini .t{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .art{width:44px;height:44px;border-radius:12px}
#mini .prog{position:absolute;left:14px;right:14px;bottom:4px;height:3px;background:rgba(29,28,34,.1);border-radius:2px}
#mini .prog i{display:block;height:100%;width:0;background:var(--char);border-radius:2px}
#mini .ib{color:var(--fg);width:38px;height:38px}

nav#tabs{display:flex;justify-content:space-around;align-items:center;margin:0 16px 10px;height:64px;border-radius:32px;background:rgba(29,28,34,.94);box-shadow:0 12px 30px rgba(29,28,34,.25);padding:0 10px}
nav#tabs button{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#a9a6b3}
nav#tabs button[aria-current="page"]{background:var(--lav);color:var(--char)}

/* night scope: full player + queue use the same tokens, recoloured */
#player,#qv{--ink:#18171c;--deck:#25242b;--deck-2:#302f37;--glass:rgba(255,255,255,.07);--line:#38373f;--fg:#f5f3f8;--mute:#a19eab;--tape:#f3cf62;--tape-ink:#1d1c22;color-scheme:dark;color:var(--fg)}
#player{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#26252b,#141317);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#player.open{transform:none;visibility:visible}
#player .glow{position:absolute;inset:0;background:radial-gradient(90% 55% at 85% 5%,rgb(var(--c,120 100 200) / .55),transparent 70%),radial-gradient(70% 45% at 0% 100%,rgba(196,180,244,.18),transparent 70%);pointer-events:none;transition:background .6s ease}
#player .in{position:relative;flex:1;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);min-height:0}
.ph-top{display:flex;align-items:center;justify-content:space-between;height:52px}
.ph-top .ib{width:44px;height:44px;background:rgba(255,255,255,.08);color:var(--fg)}
.ph-top .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:500;color:var(--mute);text-align:center;flex:1;min-width:0}
.ph-top .lbl b{display:block;text-transform:none;letter-spacing:0;font-size:15px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:18px 0}
.ph-art .art{width:min(100%,46vh);height:auto;aspect-ratio:1;border-radius:28px;font-size:72px;box-shadow:0 26px 60px rgba(0,0,0,.5);animation:artIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes artIn{from{opacity:.4;transform:scale(.94)}to{opacity:1;transform:none}}
.ph-info{display:flex;align-items:center;gap:12px}
.ph-info .meta{flex:1;min-width:0}
.ph-info .t{font:400 27px/1.15 var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-info .s{color:var(--mute);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ph-info .ib{width:46px;height:46px;color:var(--fg)}
.ph-info .ib.on{color:var(--tape)}
.seek{margin-top:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--lav) var(--p,0%),rgba(255,255,255,.16) var(--p,0%))}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--lav) var(--p,0%),rgba(255,255,255,.16) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--butter);margin-top:-5.5px;box-shadow:0 0 0 4px rgba(243,207,98,.2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--butter);border:0}
.times{display:flex;justify-content:space-between;font:400 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums;margin-top:2px}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.ctrls .ib{width:50px;height:50px;color:var(--fg);position:relative}
.ctrls .ib.on{color:var(--tape)}

.ctrls .main{width:74px;height:74px;border-radius:50%;background:var(--lav);color:var(--char);display:grid;place-items:center;box-shadow:0 10px 30px rgba(196,180,244,.35)}
.ctrls .main:active{transform:scale(.95)}
.ph-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--mute);font-size:12px}
.ph-bottom .ib{color:var(--fg);background:rgba(255,255,255,.08)}
.fmt{font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* queue (night scope) */
#qv{position:fixed;inset:0;z-index:35;background:linear-gradient(180deg,#24232a,#141317);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}

.qv-top{display:flex;align-items:center;justify-content:space-between;height:56px;flex:none}
.qv-top .ib{background:rgba(255,255,255,.08)}
.qv-top b{font:500 18px var(--display)}
.qv-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:0 16px;min-height:0}
.qsec{font:500 18px var(--display);margin:14px 0 10px;display:block}
.qnow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border-radius:20px;padding:8px}.qnow .meta{flex:1;min-width:0}.qnow .t{font-weight:500;color:var(--tape);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qnow .s{font-size:13px;color:var(--mute)}
.qnow.paused .eq i{animation-play-state:paused}
.qhdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 6px;min-height:28px}

.qlink{color:var(--mute);font-weight:500;font-size:14px;white-space:nowrap;padding:4px 0}
.qrow2{display:flex;align-items:center;gap:10px;min-height:62px;background:transparent;position:relative;border-radius:16px;padding:0 2px}
.qrow2.sel{background:rgba(243,207,98,.1)}
.qrow2.drag{background:var(--deck-2);box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:3}
.qrow2.swd{background:rgba(217,72,95,.25)}
.qck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.qck[aria-pressed="true"]{border:0}
.qtap{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer}
.qtap .meta{flex:1;min-width:0}.qtap .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qtap .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qnote{margin:16px 0 0}
.qv-foot{flex:none;padding-block:10px calc(env(safe-area-inset-bottom,0px) + 12px)}
.qctl{display:flex;align-items:center;justify-content:space-around;background:rgba(255,255,255,.07);border-radius:34px;height:68px;padding:0 8px}
.qctl .ib{color:var(--fg);width:46px;height:46px}.qctl .ib.on{color:var(--tape)}
.qplay{width:54px;height:54px;border-radius:50%;background:var(--lav);color:var(--char);display:grid;place-items:center}
.qselbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:58px;background:rgba(255,255,255,.07);border-radius:30px;padding:6px 8px 6px 18px}.qselbar span{flex:1;min-width:0}
#qv .pill{background:rgba(255,255,255,.12);color:var(--fg);box-shadow:none}
#qv .pill.amber{background:var(--butter);color:var(--char)}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(29,28,34,.35);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fbf9fd;border-radius:30px 30px 0 0;max-height:82vh;overflow-y:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:760px;margin:0 auto;box-shadow:0 -10px 40px rgba(80,60,130,.15)}
#sheet.open{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sh-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sh-head .meta{min-width:0;flex:1}
.sh-head .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;text-align:left;font-size:16px;font-weight:400;border-radius:14px}

.opt svg{color:var(--mute);flex:none}
.opt.danger{color:var(--danger)}.opt.danger svg{color:var(--danger)}
.field{display:flex;flex-direction:column;gap:8px;padding:6px 0 4px}
.field label{font-weight:400;font-family:var(--display);font-size:22px;letter-spacing:-.01em}
.field input{height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--fg);font:400 16px var(--body);padding:0 14px;-webkit-user-select:text;user-select:text}
.field input:focus{outline:2px solid var(--lav);border-color:transparent}
.sh-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.sh-acts .pill{height:46px;padding:0 20px;border-radius:23px;font-size:15px}
.pill.red{background:var(--danger);color:#fff}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 160px);transform:translate(-50%,12px);background:var(--char);color:#fff;font-weight:500;font-size:14px;padding:11px 18px;border-radius:22px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(29,28,34,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;z-index:70;background:rgba(241,236,246,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;text-align:center}
#busy b{display:block;font:300 28px var(--display);margin-bottom:6px}
#busy .meter{width:220px;margin:12px auto 0}

@media (prefers-reduced-motion:reduce){#player,#sheet,#scrim,#toast,#qv{transition:none}.eq i{animation:none;height:8px}main.enter>*,.pop,.ph-art .art{animation:none;opacity:1;transform:none}.wrcard.ready{animation:none}}
</style>

<div id="app">
  <header class="top gut" id="top"></header>
  <main class="gut" id="main"></main>
  <div id="mini" hidden data-act="openPlayer" role="button" tabindex="0" aria-label="Open player">
    <div id="miniArt"></div>

    <button class="ib" data-act="likeCur" id="miniLike" aria-label="Like"></button>
    <button class="ib" data-act="queue" id="miniQueue" aria-label="Show queue"></button>
    <button class="ib" data-act="toggle" id="miniPlay" aria-label="Play"></button>
    <button class="ib" data-act="next" id="miniNext" aria-label="Next song"></button>
    <div class="prog"><i id="miniProg"></i></div>

  <nav id="tabs" class="gut" aria-label="Sections">
    <button data-act="tab" data-tab="home" id="tab-home"></button>
    <button data-act="tab" data-tab="search" id="tab-search"></button>

</div>

<section id="player" aria-label="Now playing">

      <button class="ib" data-act="likeCur" id="phLike" aria-label="Like"></button>

</section>

<section id="qv" hidden role="dialog" aria-modal="true" aria-label="Queue"><div class="qv-in"><header class="qv-top gut"><button class="ib" data-act="closeQ" aria-label="Close queue" style="color:var(--fg)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button><b>Queue</b><span style="width:38px"></span></header><div class="qv-body gut" id="qvBody"></div><footer class="qv-foot gut" id="qvFoot"></footer></div></section>
<div id="story" hidden role="dialog" aria-modal="true" aria-label="Kazeta Wrapped story"></div>
<div id="scrim" data-act="closeSheet"></div>
<div id="sheet" class="gut" role="dialog" aria-modal="true"></div>

<input type="file" id="imgfile" accept="image/*" hidden>
<input type="file" id="file" multiple accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.aif,.aiff" hidden>

  H('play',()=>resume());H('pause',()=>{if(isPaused()&&curId())resume();else userPause();});H('stop',()=>userPause());
  H('previoustrack',()=>prev());H('nexttrack',()=>next());

function bindQDrag(){
  const list=$('#qdl'),body=$('#qvBody');if(!list)return;
  list.querySelectorAll('.qh').forEach(h=>h.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    const row=h.closest('.qrow2');let lastY=e.clientY,raf=0;row.classList.add('drag');
    const place=()=>{const cands=[...list.children].filter(el=>el!==row&&(el.classList.contains('qrow2')||el.classList.contains('qsep')));
      let before=null;for(const el of cands){const r=el.getBoundingClientRect();if(lastY<r.top+r.height/2){before=el;break;}}
      if(before){if(row.nextElementSibling!==before)list.insertBefore(row,before);}else if(list.lastElementChild!==row)list.appendChild(row);};
    const tick=()=>{const b=body.getBoundingClientRect();if(lastY<b.top+60)body.scrollTop-=8;else if(lastY>b.bottom-60)body.scrollTop+=8;place();raf=requestAnimationFrame(tick);};
    raf=requestAnimationFrame(tick);
    const move=ev=>{lastY=ev.clientY;};
    /* listen on window: moving the row in the list would drop a pointer capture on the handle */
    const up=()=>{cancelAnimationFrame(raf);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);row.classList.remove('drag');
      const C=S.ctx,uq=[],rest=[];let after=false;
      for(const el of list.children){if(el.classList.contains('qsep')){after=true;continue;}if(!el.classList.contains('qrow2'))continue;(after?rest:uq).push(el.dataset.id);}
      const moved=uq.join()!==S.uq.join()||rest.join()!==C.ids.slice(C.i+1).join();
      if(moved){S.uq=uq;C.ids=C.ids.slice(0,C.i+1).concat(rest);if(!S.shuffle)C.base=C.ids.slice();qSel.clear();afterQueueChange();}};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  }));
}

  {const C=S.ctx,before=C.ids.slice(0,Math.max(0,C.i+1)).filter(x=>x===id).length;

  newpl:()=>openNameForm('New playlist','Create','',async n=>{const p=await newPlaylist(n);S.stack.push({type:'playlist',key:p.id});render();}),
  renamepl:el=>{const p=S.playlists.find(p=>p.id===el.dataset.id);if(!p)return;openNameForm('Rename playlist','Save',p.name,async n=>{p.name=n;await savePl(p);render();});},
  delpl:el=>{const p=S.playlists.find(p=>p.id===el.dataset.id);if(!p)return;openSheet(`<div class="field"><label>Delete “${esc(p.name)}”?</label><p class="muted" style="margin:0">The songs stay in your library.</p></div><div class="sh-acts"><button class="pill" data-act="closeSheet">Cancel</button><button class="pill red" data-act="delplYes" data-id="${p.id}">Delete playlist</button></div>`);},
  delplYes:async el=>{closeSheet();{const p=S.playlists.find(p=>p.id===el.dataset.id);if(p&&p.cover)await db.del('art',p.cover).catch(()=>{});}await db.del('playlists',el.dataset.id);S.playlists=S.playlists.filter(p=>p.id!==el.dataset.id);S.stack=S.stack.filter(v=>v.key!==el.dataset.id);render();toast('Playlist deleted');},
  rmpl:async el=>{closeSheet();const [,pid,tid]=el.dataset.ctx.split(':');const p=S.playlists.find(p=>p.id===pid);if(!p)return;const ix=p.ids.indexOf(tid);if(ix>=0)p.ids.splice(ix,1);await savePl(p);render();toast(`Removed from ${p.name}`);},
  goalbum:el=>{const t=S.byId.get(el.dataset.id);if(!t)return;A.open({dataset:{type:'album',key:alKey(t)}});},
  goartist:el=>{const t=S.byId.get(el.dataset.id);if(!t)return;const as=artistsOf(t);if(as.length===1){A.open({dataset:{type:'artist',key:as[0].k}});return;}
    openSheet(`<div class="field"><label>Go to artist</label></div>`+as.map(a=>{const tt=artistTrack(a.k);return `<button class="opt" data-act="open" data-type="artist" data-key="${esc(a.k)}">${art(tt,'sm','round')}<span>${esc(a.n)}</span></button>`;}).join(''));},
  del:el=>{const t=S.byId.get(el.dataset.id);openSheet(sheetHead(t)+`<div class="field"><label>Delete this song?</label><p class="muted" style="margin:0">It is removed from Kazeta and all playlists. The original file in the Files app stays.</p></div><div class="sh-acts"><button class="pill" data-act="closeSheet">Cancel</button><button class="pill red" data-act="delYes" data-id="${t.id}">Delete song</button></div>`);},
  delYes:async el=>{closeSheet();await deleteTrack(el.dataset.id);updateNow();savePrefs();if(S.stack.length&&!viewTracks(view()).length&&view().type!=='playlist'&&view().type!=='liked')S.stack.pop();render();toast('Song deleted');},
  rmdemo:async()=>{for(const t of S.tracks.filter(t=>t.demo))await deleteTrack(t.id);updateNow();savePrefs();render();toast('Demo songs removed');},
  update:()=>checkUpdate(),
  sortset:el=>{LS.set(el.dataset.sk,el.dataset.k);render();},
  cover:el=>{const p=S.playlists.find(p=>p.id===el.dataset.id);if(!p)return;S.coverFor=p.id;
    if(!p.cover){$('#imgfile').click();return;}
    openSheet(`<div class="field"><label>Playlist cover</label></div>`+optH('album','Choose a new photo','coverPick')+optH('trash','Remove cover','coverRm','','danger'));},
  coverPick:()=>{closeSheet();$('#imgfile').click();},
  coverRm:async()=>{closeSheet();const p=S.playlists.find(p=>p.id===S.coverFor);if(!p||!p.cover)return;await db.del('art',p.cover).catch(()=>{});const u=S.artURL.get(p.cover);if(u)URL.revokeObjectURL(u);S.artURL.delete(p.cover);p.cover=null;await savePl(p);render();toast('Cover removed');},
  levelToggle:()=>{LS.set('normalize',!LS.get('normalize',true));fillLevel();if(pre){URL.revokeObjectURL(pre.url);pre=null;}prepareNext();toast(LS.get('normalize',true)?'Volume levelling on, from the next song':'Volume levelling off, from the next song');if(LS.get('normalize',true))analyzeLibrary();},
  storyReady:()=>{if(S.readyPer)openStory(S.readyPer);},
  storyRoll:()=>{const key=LS.get('wrapRange','week'),[,label,days]=RANGES.find(r=>r[0]===key)||RANGES[0];const now=Date.now();openStory({kind:key,from:sod(now)-(days-1)*DAY,to:now+1,title:`Your last ${label.toLowerCase()}`,noun:label.toLowerCase(),range:`Last ${label.toLowerCase()}`});},
  wrange:el=>{LS.set('wrapRange',el.dataset.k);renderWrapped();},
  dismissImport:()=>{S.lastImport=[];LS.set('lastImport',null);S.stack=S.stack.filter(v=>v.type!=='imported');render();toast('Your songs stay in All songs');},
  addAllTo:()=>{const ids=viewTracks({type:'imported'}).map(t=>t.id);if(!ids.length)return;
    openSheet(`<div class="field"><label>Add ${plural(ids.length,'song')} to…</label></div>`+optH('plus','New playlist','addAllNew')+S.playlists.map(p=>`<button class="opt" data-act="addAllPl" data-pl="${p.id}">${plArt(p,'sm')}<span>${esc(p.name)}<span class="muted small" style="display:block">${plural(p.ids.length,'song')}</span></span></button>`).join(''));},
  addAllNew:()=>{const ids=viewTracks({type:'imported'}).map(t=>t.id);openNameForm('New playlist','Create','',async n=>{const p=await newPlaylist(n);p.ids=ids.slice();p.addedAt={};ids.forEach((id,i)=>p.addedAt[id]=Date.now()+i);await savePl(p);render();toast(`Created ${n} with ${plural(ids.length,'song')}`);});},
  addAllPl:async el=>{const ids=viewTracks({type:'imported'}).map(t=>t.id);const p=S.playlists.find(p=>p.id===el.dataset.pl);closeSheet();if(!p)return;
    const fresh=ids.filter(id=>!p.ids.includes(id));p.ids.push(...fresh);p.addedAt=p.addedAt||{};fresh.forEach((id,i)=>p.addedAt[id]=Date.now()+i);await savePl(p);render();
    toast(fresh.length?`Added ${plural(fresh.length,'song')} to ${p.name}`+(ids.length-fresh.length?` (${ids.length-fresh.length} already there)`:''):`All of them are already in ${p.name}`);},
  persist:async()=>{let ok=false;try{ok=await navigator.storage.persist();}catch(e){}toast(ok?'Songs are protected from cleanup':isPWAFile?'Open Kazeta from your homescreen, then try again':'Only the homescreen version can do this');fillStorage();},
  hideBanner:el=>{LS.set(el.dataset.k,true);render();},
  loopToggle:()=>{S.repeat=S.repeat==='all'?'off':'all';LS.set('repeat',S.repeat);updateNow();prepareNext();render();toast(S.repeat==='all'?'Loop on':'Loop off');},
  queue:()=>{if(!S.cur)return;openQ();},
  closeQ:()=>closeQ(),
  qsel:el=>{const k=el.dataset.key;if(qSel.has(k))qSel.delete(k);else qSel.add(k);renderQ();},
  qplay:el=>{const [kind,n]=el.dataset.key.split(':'),i=+n;qSel.clear();
    if(kind==='q'){const id=S.uq[i];if(!id)return;S.uq.splice(0,i+1);S.cur={id,q:true};}
    else{const id=S.ctx.ids[i];if(!id)return;S.ctx.i=i;S.cur={id,q:false};}
    loadCur(true);},
  qclear:()=>{S.uq=[];qSel.clear();afterQueueChange();toast('Queue cleared');},
  qrmSel:()=>{const n=qSel.size;qApply(k=>!qSel.has(k));qSel.clear();afterQueueChange();toast(`Removed ${plural(n,'song')}`);},
  qaddSel:()=>{const C=S.ctx,add=[];for(let j=C.i+1;j<C.ids.length;j++)if(qSel.has('c:'+j))add.push(C.ids[j]);
    qApply(k=>!(k.startsWith('c:')&&qSel.has(k)));S.uq.push(...add);qSel.clear();afterQueueChange();toast(add.length?`Added ${plural(add.length,'song')} to queue`:'Those songs are already in your queue');},
};
document.addEventListener('click',e=>{if(swallow&&e.target.closest('.row,.qrow2'))return;const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.stopPropagation();f(el,e);}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();}if(e.key==='Escape'){if(qOpen)closeQ();else{closeSheet();closePlayer();}}});
$('#imgfile').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';const p=S.playlists.find(p=>p.id===S.coverFor);if(!f||!p)return;
  try{const r=await processArt(f);const key='pl:'+p.id+':'+Date.now();await db.put('art',r.blob,key);
    if(p.cover){await db.del('art',p.cover).catch(()=>{});const u=S.artURL.get(p.cover);if(u)URL.revokeObjectURL(u);S.artURL.delete(p.cover);}
    S.artURL.set(key,URL.createObjectURL(r.blob));p.cover=key;await savePl(p);render();toast('Cover updated');}
  catch(err){toast("That image couldn't be opened. Try another photo.");}});
$('#file').addEventListener('change',e=>{const f=e.target.files;if(f&&f.length)importFiles(f);e.target.value='';});
/* swipe left = next song, swipe right = previous (mini player and big artwork) */
let swiped=false;
function swipeSkip(el,slideEl){let x0=null,y0=0;
  el.addEventListener('touchstart',e=>{if(e.target.closest('button,input'))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchmove',e=>{if(x0==null)return;const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;if(Math.abs(dx)>Math.abs(dy)&&slideEl)slideEl.style.transform=`translateX(${dx*0.6}px)`;},{passive:true});
  el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(slideEl){slideEl.style.transition='transform .2s';slideEl.style.transform='';setTimeout(()=>{slideEl.style.transition='';},220);}
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3){swiped=true;setTimeout(()=>{swiped=false;},400);if(dx<0)next();else prev();}},{passive:true});}
swipeSkip($('#mini'),$('#mini .meta'));swipeSkip($('#phArt'),$('#phArt'));
/* swipe right on a song = Add to queue (like Spotify); swipe left on a queue row = remove */
let swallow=false;
(()=>{let r=null,x0=0,y0=0,dx=0,on=false;
  const start=(row,e)=>{r=row;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;on=false;};
  const move=(e,dir)=>{if(!r)return;dx=e.touches[0].clientX-x0;const dy=e.touches[0].clientY-y0;if(!on&&Math.abs(dy)>Math.abs(dx)){r=null;return;}
    if(dx*dir>8){on=true;r.style.transform=`translateX(${dir>0?Math.min(dx,120):Math.max(dx,-120)}px)`;r.classList.toggle(dir>0?'swq':'swd',dx*dir>80);}};
  const end=(fn,dir)=>{if(!r)return;const row=r;r=null;row.style.transition='transform .2s';row.style.transform='';setTimeout(()=>{row.style.transition='';row.classList.remove('swq','swd');},220);
    if(on){swallow=true;setTimeout(()=>{swallow=false;},350);}if(dx*dir>80)fn(row);};
  const m=$('#main');
  m.addEventListener('touchstart',e=>{const row=e.target.closest('.row[data-tid]');if(row&&!e.target.closest('button'))start(row,e);},{passive:true});
  m.addEventListener('touchmove',e=>move(e,1),{passive:true});
  m.addEventListener('touchend',()=>end(row=>A.addq({dataset:{id:row.dataset.tid}}),1),{passive:true});
  const q=$('#qvBody');
  q.addEventListener('touchstart',e=>{const row=e.target.closest('.qrow2');if(row&&!e.target.closest('.qh,.qck'))start(row,e);},{passive:true});
  q.addEventListener('touchmove',e=>move(e,-1),{passive:true});
  q.addEventListener('touchend',()=>end(row=>{const k=row.dataset.key;qApply(x=>x!==k);qSel.delete(k);afterQueueChange();toast('Removed from queue');},-1),{passive:true});
})();
/* swipe down to close the player */
(()=>{let y0=null;const p=$('#player');p.addEventListener('touchstart',e=>{if(e.target.closest('input'))return;y0=e.touches[0].clientY;},{passive:true});p.addEventListener('touchend',e=>{if(y0!=null&&e.changedTouches[0].clientY-y0>110)closePlayer();y0=null;},{passive:true});})();

/* ---------- boot ---------- */
(async()=>{
  try{await openDB();}catch(e){useMem=true;}
  try{await loadAll();}catch(e){useMem=true;await loadAll();}
  for(const t of S.tracks){const c=cleanTitle(t.title);if(c!==t.title){t.title=c;db.put('tracks',t).catch(()=>{});}}
  const li=LS.get('lastImport',null);if(li&&li.ids){S.lastImport=li.ids.filter(id=>S.byId.has(id));S.lastImportAt=li.at||0;}
  const s=LS.get('session',null);
  if(s&&(s.ctx||s.queue)){const ok=id=>S.byId.has(id);
    if(s.ctx){const oc=s.ctx.ids[s.ctx.i];S.ctx={ids:(s.ctx.ids||[]).filter(ok),base:(s.ctx.base||[]).filter(ok),i:-1};S.ctx.i=oc?S.ctx.ids.indexOf(oc):-1;
      S.uq=(s.uq||[]).filter(ok);if(s.cur&&ok(s.cur.id))S.cur={id:s.cur.id,q:!!s.cur.q};}
    else{const cid=s.queue[s.qi];S.ctx={ids:s.queue.filter(ok),base:(s.base||[]).filter(ok),i:-1};S.ctx.i=S.ctx.ids.indexOf(cid);if(S.ctx.i>=0)S.cur={id:cid,q:false};}
    if(!S.ctx.base.length)S.ctx.base=S.ctx.ids.slice();S.from=s.from||'Your library';
    if(S.cur)await loadCur(false,s.time);}
  render();updateNow();
  setTimeout(()=>{if(LS.get('normalize',true))analyzeLibrary();},2500);
  if(isPWAFile&&'serviceWorker' in navigator){
    const hadCtl=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!reloaded&&audio.paused){reloaded=true;location.reload();}});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      swReg=reg;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
    }).catch(()=>{});
  }
})();
})();
</script>
</body>
