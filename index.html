<html lang="en">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Kazeta</title>

<style>
/* Layout: one-screen app shell. Scrolling library in the middle, mini player + tab bar docked at the bottom, full-screen tape deck as an overlay. Deliberately dark-only. */
:root{
  --ink:#0d1017;      /* page */
  --deck:#171b25;     /* raised surfaces */
  --deck-2:#212736;   /* pressed / chips */
  --line:#2b3242;
  --fg:#eef0f5;
  --mute:#99a0b1;
  --tape:#f5a524;     /* accent: amber like an old tape label */
  --tape-ink:#1b1305;
  --danger:#ff6b6b;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ink);color:var(--fg);font:15px/1.4 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--tape);outline-offset:2px;border-radius:6px}
svg{display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding-block:12px 8px;min-height:56px}
.top h1{flex:1;margin:0;font:800 26px/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .back{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--deck);margin-left:-4px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--deck-2);font-weight:600;font-size:14px;white-space:nowrap}
.pill.amber{background:var(--tape);color:var(--tape-ink)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:4px 24px;min-height:0}
h2{font:700 19px/1.2 var(--display);letter-spacing:-.01em;margin:26px 0 12px}
.muted{color:var(--mute)}
.small{font-size:13px}

/* art */
.art{flex:none;border-radius:6px;object-fit:cover;background:var(--deck-2);display:grid;place-items:center;overflow:hidden;font:800 18px var(--display);color:rgba(255,255,255,.85)}
.art.ph{background:linear-gradient(135deg,hsl(var(--h) 45% 38%),hsl(calc(var(--h) + 40) 40% 22%))}
.art.sm{width:46px;height:46px;font-size:17px}
.art.md{width:56px;height:56px}
.art.lg{width:100%;aspect-ratio:1;max-width:100%;font-size:44px;border-radius:8px}
.art.round{border-radius:50%}
.art.liked{background:linear-gradient(140deg,#f5a524,#d9476b 70%,#6b2fb3);color:#fff}

/* rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:7px 0;min-height:60px;cursor:pointer;border-radius:8px}
.row:active{background:var(--deck)}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.cur .t{color:var(--tape)}
.row .lk{color:var(--tape)}
.dur{font:500 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--mute);flex:none}
.ib:active{background:var(--deck-2)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:5px;vertical-align:-1px}
.eq i{width:3px;background:var(--tape);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* home */
.hello{font:800 30px/1.1 var(--display);letter-spacing:-.025em;margin:6px 0 16px;text-wrap:balance}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;background:var(--deck);border-radius:8px;overflow:hidden;min-width:0;height:56px;text-align:left;font-weight:600;font-size:14px}
.tile .art{border-radius:0}
.tile span{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding-right:8px;line-height:1.25}
.shelf{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.shelf::-webkit-scrollbar{display:none}
.cover{flex:none;width:132px;scroll-snap-align:start;text-align:left}
.cover .art{width:132px;height:132px}
.cover b{display:block;font-weight:600;font-size:14px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.grid2 .cover{width:auto}
.grid2 .cover .art{width:100%;height:auto;aspect-ratio:1}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:22px 20px 24px;background:var(--deck);border-radius:14px;margin-top:8px}
.empty h3{margin:0;font:800 22px/1.15 var(--display);letter-spacing:-.015em}
.empty p{margin:0;color:var(--mute);max-width:46ch}
.empty .acts{display:flex;flex-wrap:wrap;gap:8px}
.cassette{width:150px;height:96px;margin-bottom:4px}
.steps{margin:0;padding-left:20px;color:var(--mute);display:flex;flex-direction:column;gap:4px}

.banner{display:flex;gap:10px;align-items:flex-start;background:#2a2214;color:#f8dca6;border:1px solid #4b3a1a;border-radius:10px;padding:10px 8px 10px 12px;font-size:13px;margin:4px 0 12px}
.banner p{margin:0;flex:1}
.banner .ib{width:28px;height:28px;color:#f8dca6}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px 0 14px}
.chip{height:32px;padding:0 14px;border-radius:16px;background:var(--deck-2);font-size:14px;font-weight:600;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar .grow{flex:1;min-width:0}
.playbig{width:52px;height:52px;border-radius:50%;background:var(--tape);color:var(--tape-ink);display:grid;place-items:center;flex:none}
.playbig:active{transform:scale(.96)}

/* detail header */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:4px}
.hero .art.lg,.hero .mosaic{width:min(62vw,240px)}
.hero .kind{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin-top:12px;font-weight:600}
.hero h3{margin:0;font:800 26px/1.12 var(--display);letter-spacing:-.02em;text-wrap:balance}
.hero .sub{color:var(--mute);font-size:14px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1;border-radius:8px;overflow:hidden;max-width:100%}
.mosaic .art{width:100%;height:100%;border-radius:0}
.pc{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
.pc .pill{height:40px;padding:0 16px;border-radius:20px;font-size:14px}
.pc .pill.on{background:var(--deck);color:var(--tape);box-shadow:inset 0 0 0 1.5px var(--tape)}
.qh2{font:700 17px var(--display);margin:4px 0 10px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 6px}
.qrow{background:var(--deck);transition:transform .15s}
.qrow.drag{transition:none;position:relative;z-index:5;background:var(--deck-2);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.qh{width:40px;height:44px;display:grid;place-items:center;color:var(--mute);touch-action:none;flex:none;cursor:grab}
.qx{width:34px;height:34px}
.ck{display:inline-block;vertical-align:-2px;margin-right:4px}.ck svg{display:inline}
.ckempty{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt .ckc{color:inherit}
.impcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--deck);border-radius:12px;padding:10px 12px 10px 10px;margin-bottom:12px;box-shadow:inset 0 0 0 1.5px var(--tape)}
.impcard .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.impcard b{font:700 16px var(--display)}.impcard small{color:var(--mute);font-size:13px}
.impcard svg{color:var(--tape)}
.wrcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:12px;padding:14px 12px 14px 16px;margin-top:14px;background:linear-gradient(120deg,#f5a524,#d9476b 60%,#6b2fb3);color:#fff}
.wrcard .meta{flex:1;min-width:0;display:flex;flex-direction:column}.wrcard b{font:800 18px var(--display)}.wrcard small{font-size:13px;opacity:.9}
.wr-hero{border-radius:16px;padding:20px 18px;background:linear-gradient(150deg,#f5a524 0%,#d9476b 55%,#5b2a9e 100%);color:#fff}
.wr-hero p{margin:8px 0 0;opacity:.92}
.wr-k{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.85}
.wr-big{font:800 64px/1 var(--display);letter-spacing:-.04em;margin-top:10px;font-variant-numeric:tabular-nums}
.wr-unit{font:700 18px var(--display);margin-top:2px}
.wr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.wr-tile{background:var(--deck);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wr-tile b{font:800 30px/1.05 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.wr-tile b small{font-size:16px;color:var(--mute);font-weight:600}
.wr-tile span{color:var(--mute);font-size:13px}
.wr-song{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:var(--deck);border-radius:12px;padding:12px;margin-top:8px}
.wr-song .art.lg{width:110px;font-size:40px}
.wr-st{font:800 21px/1.15 var(--display);margin:4px 0 2px;overflow-wrap:anywhere}
.wr-song .wr-k{color:var(--tape);opacity:1}
.wr-list{list-style:none;margin:0;padding:0;counter-reset:n;display:flex;flex-direction:column;gap:4px}
.wr-list li{display:flex;align-items:center;gap:12px;counter-increment:n;min-height:56px}
.wr-list li::before{content:counter(n);font:800 20px var(--display);color:var(--tape);width:18px;text-align:center;flex:none}
.wr-list .meta{flex:1;min-width:0}.wr-list .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wr-list .s{font-size:13px;color:var(--mute)}
.wr-bars{display:flex;align-items:flex-end;gap:2px;height:60px;margin-top:12px}
.wr-bars i{flex:1;background:var(--tape);border-radius:2px 2px 0 0;opacity:.85}
.wr-axis{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--mute);margin-top:4px}
.wide{margin-top:0}
#story{position:fixed;inset:0;z-index:55;background:#000;color:#fff;display:flex;justify-content:center;-webkit-user-select:none;user-select:none}
.st-in{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden}
.st-prog{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;gap:4px;z-index:3}
.st-prog i{flex:1;height:3px;background:rgba(255,255,255,.32);border-radius:2px;overflow:hidden}
.st-prog i b{display:block;height:100%;width:0;background:#fff}
.st-prog i.done b{width:100%}.st-prog i.now b{animation:stfill 7s linear forwards}
@keyframes stfill{to{width:100%}}
.st-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);right:max(8px,env(safe-area-inset-right,0px));z-index:4;width:44px;height:44px;display:grid;place-items:center;color:#fff}
.slide{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 80px) 26px calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;justify-content:center;gap:12px;font-size:17px;line-height:1.4}
.slide .k{font-size:13px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;opacity:.85}
.slide .xl{font:800 40px/1.02 var(--display);letter-spacing:-.03em;text-wrap:balance}
.slide .l{font:800 30px/1.08 var(--display);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.slide .huge{font:800 104px/.9 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.slide .huge .of{font-size:44px;opacity:.6}
.slide .hint{margin-top:28px;font-size:13px;opacity:.7}
.slide .cov .art.lg{width:min(68vw,280px);box-shadow:0 20px 50px rgba(0,0,0,.4);font-size:72px}
.pop{opacity:0;transform:translateY(18px);animation:popin .6s cubic-bezier(.2,.8,.2,1) forwards}
.slide>.pop:nth-child(2){animation-delay:.12s}.slide>.pop:nth-child(3){animation-delay:.28s}.slide>.pop:nth-child(4){animation-delay:.45s}.slide>.pop:nth-child(5){animation-delay:.6s}.slide>.pop:nth-child(6){animation-delay:.75s}
@keyframes popin{to{opacity:1;transform:none}}
.s-a{background:linear-gradient(160deg,#f5a524,#d9476b 60%,#5b2a9e)}
.s-b{background:linear-gradient(170deg,#1d1b5e,#5b2a9e 55%,#d9476b)}
.s-c{background:linear-gradient(160deg,#0f5c4d,#18806a 50%,#f5a524)}
.s-d{background:linear-gradient(180deg,#3b1a12,#9b3a1f 60%,#f5a524)}
.s-e{background:linear-gradient(170deg,#121a3a,#1f3f8a)}
.s-f{background:linear-gradient(160deg,#5b2a9e,#2a1650 60%,#0d1017)}
.s-g{background:linear-gradient(170deg,#3a0f2a,#8a1f4f)}
.s-h{background:linear-gradient(180deg,#0d1017,#1b2547 60%,#f5a524)}
.s-i{background:linear-gradient(160deg,#d9476b,#f5a524)}
.s-j{background:linear-gradient(160deg,#f5a524,#d9476b 55%,#5b2a9e)}
.st-list{list-style:none;margin:6px 0 0;padding:0;counter-reset:n;display:flex;flex-direction:column;gap:12px}
.st-list li{display:flex;align-items:center;gap:12px;counter-increment:n}
.st-list li::before{content:counter(n);font:800 28px var(--display);width:24px;text-align:center;flex:none}
.st-list .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.st-list b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st-list small{opacity:.75;font-size:14px}
.st-list>li>span{font:500 14px var(--mono);opacity:.85}
.st-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:22px;background:#fff;color:#111;font-weight:700;margin-top:6px}
.st-bars-h{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:14px}
.st-bars-h i{flex:1;background:#fff;opacity:.9;border-radius:3px 3px 0 0}
.st-axis{display:flex;justify-content:space-between;font:500 12px var(--mono);opacity:.75}
.sum{background:rgba(13,16,23,.88);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sum .k{font-size:12px}
.sum-top{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.sum-top .art.lg{width:120px;font-size:40px}
.sum small{display:block;font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.sum b{display:block;font:800 19px/1.15 var(--display);overflow-wrap:anywhere}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-grid b{font-size:24px;color:var(--tape)}
.sum-list{margin:0;padding-left:22px;font-weight:600;display:flex;flex-direction:column;gap:2px}
.sum-list li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrcard.ready{margin:0 0 12px;background:linear-gradient(120deg,#5b2a9e,#d9476b 55%,#f5a524);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(245,165,36,.45)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none;opacity:1;transform:none}.wrcard.ready{animation:none}}
.textbtns{display:flex;gap:6px;flex-wrap:wrap}

/* search */
.searchbox{position:relative;margin:2px 0 8px}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}
.searchbox input{width:100%;height:46px;border-radius:10px;border:0;background:var(--fg);color:#111;font:500 16px var(--body);padding:0 14px 0 40px;-webkit-user-select:text;user-select:text}
.searchbox input:focus{outline:2px solid var(--tape)}

/* storage */
.card{background:var(--deck);border-radius:12px;padding:14px 16px;margin-top:28px;display:flex;flex-direction:column;gap:8px}
.card h4{margin:0;font:700 15px var(--display)}
.meter{height:6px;border-radius:3px;background:var(--deck-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--tape)}

/* mini player */
#mini{margin:0 8px 6px;border-radius:10px;background:rgb(var(--c,40 46 60));position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:7px 6px 9px 7px;cursor:pointer}
#mini::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.42);pointer-events:none}
#mini>*{position:relative;z-index:1}
#mini .meta{flex:1;min-width:0}
#mini .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .s{font-size:13px;color:rgba(238,240,245,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .art{width:42px;height:42px;border-radius:5px}
#mini .prog{position:absolute;left:8px;right:8px;bottom:3px;height:2px;background:rgba(255,255,255,.22);border-radius:1px;z-index:2}
#mini .prog i{display:block;height:100%;width:0;background:#fff;border-radius:1px}
#mini .ib{color:var(--fg)}

nav#tabs{display:grid;grid-template-columns:repeat(3,1fr);padding-block:6px 4px;background:var(--ink)}
nav#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 0}
nav#tabs button[aria-current="page"]{color:var(--fg)}

/* full player */
#player{position:fixed;inset:0;z-index:30;background:var(--ink);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#player.open{transform:none;visibility:visible}
#player .glow{position:absolute;inset:0;background:linear-gradient(180deg,rgb(var(--c,40 46 60)) 0%,var(--ink) 78%);opacity:.75;pointer-events:none}
#player .in{position:relative;flex:1;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);min-height:0}
.ph-top{display:flex;align-items:center;justify-content:space-between;height:48px}
.ph-top .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:rgba(238,240,245,.8);text-align:center;flex:1;min-width:0}
.ph-top .lbl b{display:block;text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:16px 0}

.seek{margin-top:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--fg) var(--p,0%),rgba(255,255,255,.22) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--fg) var(--p,0%),rgba(255,255,255,.22) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);margin-top:-5px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:0}
.times{display:flex;justify-content:space-between;font:500 12px var(--mono);color:rgba(238,240,245,.7);font-variant-numeric:tabular-nums;margin-top:2px}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ctrls .ib{width:48px;height:48px;color:var(--fg)}
.ctrls .ib.on{color:var(--tape)}
.ctrls .ib.on::after{content:"";position:absolute;width:4px;height:4px;border-radius:2px;background:var(--tape);transform:translateY(16px)}
.ctrls .ib{position:relative}
.ctrls .main{width:68px;height:68px;border-radius:50%;background:var(--fg);color:var(--ink);display:grid;place-items:center}
.ctrls .main:active{transform:scale(.96)}
.ph-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:rgba(238,240,245,.7);font-size:12px}
.ph-bottom .ib{color:var(--fg)}
.fmt{font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--deck);border-radius:16px 16px 0 0;max-height:82vh;overflow-y:auto;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:760px;margin:0 auto}
#sheet.open{transform:none}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sh-head .meta{min-width:0;flex:1}
.sh-head .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:50px;text-align:left;font-size:16px;font-weight:500;border-radius:8px}
.opt:active{background:var(--deck-2)}
.opt svg{color:var(--mute);flex:none}
.opt.danger{color:var(--danger)}.opt.danger svg{color:var(--danger)}
.field{display:flex;flex-direction:column;gap:8px;padding:6px 0 4px}
.field label{font-weight:700;font-family:var(--display);font-size:18px}
.field input{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--fg);font:500 16px var(--body);padding:0 12px;-webkit-user-select:text;user-select:text}
.field input:focus{outline:2px solid var(--tape);border-color:transparent}
.sh-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.sh-acts .pill{height:42px;padding:0 18px;border-radius:21px;font-size:15px}
.pill.red{background:var(--danger);color:#2a0b0b}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);transform:translate(-50%,12px);background:var(--fg);color:var(--ink);font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

#busy b{display:block;font:800 22px var(--display);margin-bottom:6px}
#busy .meter{width:220px;margin:12px auto 0}

</section>

    {key:'w'+pwk.toDateString(),kind:'week',from:+pwk,to:+wk,title:'Your week',noun:'week',range:`${fd(pwk)} – ${fd(new Date(+wk-DAY))}`},

  w.innerHTML=`<div class="qh2">Now playing</div>${sheetHead(t)}
    <div class="qhead"><div class="qh2" style="margin:0">Next from: ${esc(S.from||'Your library')}</div>${up.length?'<button class="pill" data-act="qclear">Clear</button>':''}</div>
    ${up.length?`<div class="list" id="qlist">${up.map(x=>`<div class="row qrow" data-act="qjump" data-i="${x.i}">${art(x.t)}<div class="meta"><div class="t">${esc(x.t.title)}</div><div class="s">${esc(x.t.artist)}</div></div><button class="ib qx" data-act="qrm" data-i="${x.i}" aria-label="Remove ${esc(x.t.title)} from queue">${ic('x',18)}</button><span class="qh" aria-label="Drag to reorder" role="img"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg></span></div>`).join('')}</div>
    <p class="muted small" style="margin:10px 0 0">Drag ☰ to reorder. ${loopNote}</p>`:`<p class="muted">Nothing after this song. ${loopNote}</p>`}`;
  bindQueueDrag();
}
function bindQueueDrag(){
  const list=$('#qlist');if(!list)return;const sheet=$('#sheet');
  list.querySelectorAll('.qh').forEach(h=>h.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    const row=h.closest('.qrow'),rows=[...list.children],from=rows.indexOf(row),hg=row.offsetHeight,y0=e.clientY,st0=sheet.scrollTop;let to=from,raf=0,lastY=y0;
    row.classList.add('drag');try{h.setPointerCapture(e.pointerId);}catch(_){}
    const paint=()=>{const dy=lastY-y0+(sheet.scrollTop-st0);row.style.transform=`translateY(${dy}px)`;to=Math.max(0,Math.min(rows.length-1,from+Math.round(dy/hg)));
      rows.forEach((r,i)=>{if(r===row)return;let sh=0;if(from<to&&i>from&&i<=to)sh=-hg;if(from>to&&i<from&&i>=to)sh=hg;r.style.transform=sh?`translateY(${sh}px)`:'';});};
    const scroll=()=>{const b=sheet.getBoundingClientRect();if(lastY<b.top+70)sheet.scrollTop-=10;else if(lastY>b.bottom-70)sheet.scrollTop+=10;paint();raf=requestAnimationFrame(scroll);};
    raf=requestAnimationFrame(scroll);
    const move=ev=>{lastY=ev.clientY;paint();};
    const up=()=>{cancelAnimationFrame(raf);h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
      rows.forEach(r=>{r.style.transform='';});row.classList.remove('drag');
      if(to!==from){const A=S.qi+1+from,B=S.qi+1+to;const [id]=S.queue.splice(A,1);S.queue.splice(B,0,id);if(!S.shuffle)S.base=S.queue.slice();afterQueueChange();}};
    h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  }));
}
function sheetHead(t){return `<div class="sh-head">${art(t)}<div class="meta"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}${t.album?' · '+esc(t.album):''}</div></div></div>`;}
function openMenu(id,ctx){
  const t=S.byId.get(id);if(!t)return;const d=`data-id="${id}" data-ctx="${ctx||''}"`;
  let h=sheetHead(t)+optH(t.liked?'heartF':'heart',t.liked?'Remove from Liked Songs':'Save to Liked Songs','likeId',d)+
    (()=>{const n=plOf(id).length;return n?`<button class="opt" data-act="addto" ${d}>${CHECK(22)}<span>In ${plural(n,'playlist')} · Change</span></button>`:optH('library','Add to playlist','addto',d);})()+optH('next2','Play next','playnext',d)+optH('addq','Add to queue','addq',d);
  if(ctx&&ctx.startsWith('pl:'))h+=optH('minus','Remove from this playlist','rmpl',d);
  h+=optH('album','Go to album','goalbum',d)+optH('user','Go to artist','goartist',d)+optH('trash','Delete from Kazeta','del',d,'danger');
  openSheet(h);
}
function openNameForm(title,label,value,onOk){
  openSheet(`<form id="nameForm" class="field"><label for="pname">${title}</label><input id="pname" maxlength="80" value="${esc(value||'')}" placeholder="My playlist" autocomplete="off" required><div class="sh-acts"><button type="button" class="pill" data-act="closeSheet">Cancel</button><button class="pill amber" type="submit">${label}</button></div></form>`);
  const f=$('#nameForm'),inp=$('#pname');setTimeout(()=>{try{inp.focus();inp.select();}catch(e){}},280);
  f.addEventListener('submit',async e=>{e.preventDefault();const v=inp.value.trim();if(!v){inp.focus();return;}closeSheet();await onOk(v);});
}
async function newPlaylist(name,firstId){const p={id:uid(),name,ids:firstId?[firstId]:[],created:Date.now(),updated:Date.now()};await db.put('playlists',p);S.playlists.unshift(p);return p;}
async function savePl(p){p.updated=Date.now();await db.put('playlists',p);S.playlists.sort((a,b)=>(b.updated||0)-(a.updated||0));}
async function askPersist(){try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist();}catch(e){}}
async function deleteTrack(id){
  const t=S.byId.get(id);if(!t)return;
  if(curId()===id){audio.pause();audio.removeAttribute('src');audio.load();}
  const qi=S.queue.indexOf(id);S.queue=S.queue.filter(x=>x!==id);S.base=S.base.filter(x=>x!==id);if(qi>=0&&qi<S.qi)S.qi--;if(qi===S.qi)S.qi=-1;
  await db.del('blobs',id);await db.del('tracks',id);
  for(const p of S.playlists)if(p.ids.includes(id)){p.ids=p.ids.filter(x=>x!==id);await db.put('playlists',p);}
  if(t.artKey&&!S.tracks.some(x=>x.id!==id&&x.artKey===t.artKey)){await db.del('art',t.artKey);const u=S.artURL.get(t.artKey);if(u)URL.revokeObjectURL(u);S.artURL.delete(t.artKey);}
  S.tracks=S.tracks.filter(x=>x.id!==id);S.byId.delete(id);prepareNext();
}
async function toggleLike(id){const t=S.byId.get(id);if(!t)return;t.liked=!t.liked;t.likedAt=t.liked?Date.now():0;await db.put('tracks',t);toast(t.liked?'Saved to Liked Songs':'Removed from Liked Songs');if(curId()===id)updateNow();render();}

/* ---------- actions ---------- */
const A={
  tab:el=>{const n=el.dataset.tab;if(S.tab===n&&!S.stack.length&&n==='search'){const q=$('#q');if(q)q.focus();return;}S.tab=n;S.stack=[];$('#main').innerHTML='';render();$('#main').scrollTop=0;},
  open:el=>{S.stack.push({type:el.dataset.type,key:el.dataset.key});closeSheet();closePlayer();$('#main').innerHTML='';render();$('#main').scrollTop=0;},
  back:()=>{S.stack.pop();$('#main').innerHTML='';render();},
  libtab:el=>{S.libTab=el.dataset.k;LS.set('libTab',S.libTab);render();},
  play:el=>{const l=LISTS[el.dataset.l];if(!l)return;S.from=l.from||'Your library';const i=+el.dataset.i;if(curId()===l[i]){openPlayer();return;}playList(l,i);},
  playall:el=>{const l=LISTS[el.dataset.l];if(!l)return;S.from=l.from||'Your library';playList(l,0,el.dataset.sh?'shuffle':'order');},
  import:()=>$('#file').click(),
  demo:()=>addDemos(),
  toggle:()=>toggle(),next:()=>next(),prev:()=>prev(),
  shuf:()=>setShuffle(!S.shuffle),rep:()=>cycleRepeat(),
  openPlayer:()=>openPlayer(),closePlayer:()=>closePlayer(),
  likeCur:()=>{const id=curId();if(id)toggleLike(id);},
  menuCur:()=>{const id=curId();if(id)openMenu(id,'');},
  menu:el=>openMenu(el.dataset.id,el.dataset.ctx),
  closeSheet:()=>closeSheet(),
  likeId:el=>{closeSheet();toggleLike(el.dataset.id);},
  playnext:el=>{const id=el.dataset.id;closeSheet();if(S.qi<0){playList([id],0);return;}S.queue.splice(S.qi+1,0,id);savePrefs();updateNow();prepareNext();toast('Plays next');},
  addq:el=>{const id=el.dataset.id;closeSheet();if(S.qi<0){playList([id],0);return;}S.queue.push(id);savePrefs();updateNow();prepareNext();toast('Added to queue');},
  addto:el=>openAddTo(el.dataset.id),
  topl:async el=>{const id=el.dataset.id,p=S.playlists.find(p=>p.id===el.dataset.pl);if(!p)return;
    if(p.ids.includes(id)){p.ids=p.ids.filter(x=>x!==id);toast(`Removed from ${p.name}`);}else{p.ids.push(id);toast(`Added to ${p.name}`);}
    await savePl(p);openAddTo(id);render();},
  newplWith:el=>{const id=el.dataset.id;openNameForm('New playlist','Create','',async n=>{await newPlaylist(n,id);toast(`Added to ${n}`);render();});},
  newpl:()=>openNameForm('New playlist','Create','',async n=>{const p=await newPlaylist(n);S.stack.push({type:'playlist',key:p.id});render();}),
  renamepl:el=>{const p=S.playlists.find(p=>p.id===el.dataset.id);if(!p)return;openNameForm('Rename playlist','Save',p.name,async n=>{p.name=n;await savePl(p);render();});},
  delpl:el=>{const p=S.playlists.find(p=>p.id===el.dataset.id);if(!p)return;openSheet(`<div class="field"><label>Delete “${esc(p.name)}”?</label><p class="muted" style="margin:0">The songs stay in your library.</p></div><div class="sh-acts"><button class="pill" data-act="closeSheet">Cancel</button><button class="pill red" data-act="delplYes" data-id="${p.id}">Delete playlist</button></div>`);},
  delplYes:async el=>{closeSheet();await db.del('playlists',el.dataset.id);S.playlists=S.playlists.filter(p=>p.id!==el.dataset.id);S.stack=S.stack.filter(v=>v.key!==el.dataset.id);render();toast('Playlist deleted');},
  rmpl:async el=>{closeSheet();const [,pid,idx]=el.dataset.ctx.split(':');const p=S.playlists.find(p=>p.id===pid);if(!p)return;p.ids.splice(+idx,1);await savePl(p);render();toast(`Removed from ${p.name}`);},
  goalbum:el=>{const t=S.byId.get(el.dataset.id);if(!t)return;A.open({dataset:{type:'album',key:alKey(t)}});},
  goartist:el=>{const t=S.byId.get(el.dataset.id);if(!t)return;A.open({dataset:{type:'artist',key:t.artist}});},
  del:el=>{const t=S.byId.get(el.dataset.id);openSheet(sheetHead(t)+`<div class="field"><label>Delete this song?</label><p class="muted" style="margin:0">It is removed from Kazeta and all playlists. The original file in the Files app stays.</p></div><div class="sh-acts"><button class="pill" data-act="closeSheet">Cancel</button><button class="pill red" data-act="delYes" data-id="${t.id}">Delete song</button></div>`);},
  delYes:async el=>{closeSheet();await deleteTrack(el.dataset.id);updateNow();savePrefs();if(S.stack.length&&!viewTracks(view()).length&&view().type!=='playlist'&&view().type!=='liked')S.stack.pop();render();toast('Song deleted');},
  rmdemo:async()=>{for(const t of S.tracks.filter(t=>t.demo))await deleteTrack(t.id);updateNow();savePrefs();render();toast('Demo songs removed');},
  update:()=>checkUpdate(),
  storyReady:()=>{if(S.readyPer)openStory(S.readyPer);},
  storyRoll:()=>{const key=LS.get('wrapRange','week'),[,label,days]=RANGES.find(r=>r[0]===key)||RANGES[0];const now=Date.now();openStory({kind:key,from:now-days*DAY,to:now+1,title:`Your last ${label.toLowerCase()}`,noun:label.toLowerCase(),range:`Last ${label.toLowerCase()}`});},
  wrange:el=>{LS.set('wrapRange',el.dataset.k);renderWrapped();},
  dismissImport:()=>{S.lastImport=[];LS.set('lastImport',null);S.stack=S.stack.filter(v=>v.type!=='imported');render();toast('Your songs stay in All songs');},
  addAllTo:()=>{const ids=viewTracks({type:'imported'}).map(t=>t.id);if(!ids.length)return;
    openSheet(`<div class="field"><label>Add ${plural(ids.length,'song')} to…</label></div>`+optH('plus','New playlist','addAllNew')+S.playlists.map(p=>`<button class="opt" data-act="addAllPl" data-pl="${p.id}">${plArt(p,'sm')}<span>${esc(p.name)}<span class="muted small" style="display:block">${plural(p.ids.length,'song')}</span></span></button>`).join(''));},
  addAllNew:()=>{const ids=viewTracks({type:'imported'}).map(t=>t.id);openNameForm('New playlist','Create','',async n=>{const p=await newPlaylist(n);p.ids=ids.slice();await savePl(p);render();toast(`Created ${n} with ${plural(ids.length,'song')}`);});},
  addAllPl:async el=>{const ids=viewTracks({type:'imported'}).map(t=>t.id);const p=S.playlists.find(p=>p.id===el.dataset.pl);closeSheet();if(!p)return;
    const fresh=ids.filter(id=>!p.ids.includes(id));p.ids.push(...fresh);await savePl(p);render();
    toast(fresh.length?`Added ${plural(fresh.length,'song')} to ${p.name}`+(ids.length-fresh.length?` (${ids.length-fresh.length} already there)`:''):`All of them are already in ${p.name}`);},
  persist:async()=>{let ok=false;try{ok=await navigator.storage.persist();}catch(e){}toast(ok?'Songs are protected from cleanup':isPWAFile?'Open Kazeta from your homescreen, then try again':'Only the homescreen version can do this');fillStorage();},
  hideBanner:el=>{LS.set(el.dataset.k,true);render();},
  loopToggle:()=>{S.repeat=S.repeat==='off'?'all':'off';LS.set('repeat',S.repeat);updateNow();prepareNext();render();toast(S.repeat==='all'?'Loop on: the list starts again at the end':'Loop off: stops at the end');},
  queue:()=>{if(!S.byId.get(curId()))return;openSheet('<div id="qwrap"></div>','queue');renderQueue();},
  qjump:(el,e)=>{if(e&&e.target.closest('.qh,.qx'))return;closeSheet();loadIdx(+el.dataset.i,true);},
  qrm:el=>{const i=+el.dataset.i;S.queue.splice(i,1);if(!S.shuffle)S.base=S.queue.slice();afterQueueChange();toast('Removed from queue');},
  qclear:()=>{S.queue=S.queue.slice(0,S.qi+1);S.base=S.queue.slice();afterQueueChange();toast('Queue cleared');},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.stopPropagation();f(el,e);}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();}if(e.key==='Escape'){closeSheet();closePlayer();}});
$('#file').addEventListener('change',e=>{const f=e.target.files;if(f&&f.length)importFiles(f);e.target.value='';});
/* swipe down to close the player */
(()=>{let y0=null;const p=$('#player');p.addEventListener('touchstart',e=>{if(e.target.closest('input'))return;y0=e.touches[0].clientY;},{passive:true});p.addEventListener('touchend',e=>{if(y0!=null&&e.changedTouches[0].clientY-y0>110)closePlayer();y0=null;},{passive:true});})();

/* ---------- boot ---------- */
(async()=>{
  try{await openDB();}catch(e){useMem=true;}
  try{await loadAll();}catch(e){useMem=true;await loadAll();}
  const li=LS.get('lastImport',null);if(li&&li.ids){S.lastImport=li.ids.filter(id=>S.byId.has(id));S.lastImportAt=li.at||0;}
  const s=LS.get('session',null);
  if(s&&s.queue){S.queue=s.queue.filter(id=>S.byId.has(id));S.base=(s.base||[]).filter(id=>S.byId.has(id));S.from=s.from||'Your library';
    const cur=s.queue[s.qi];S.qi=S.queue.indexOf(cur);if(S.qi>=0)await loadIdx(S.qi,false,s.time);}
  render();updateNow();
  if(isPWAFile&&'serviceWorker' in navigator){
    const hadCtl=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!reloaded&&audio.paused){reloaded=true;location.reload();}});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      swReg=reg;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
    }).catch(()=>{});
  }
})();
})();
</script>
